        // ================= GAME LOGIC =================
        function walkForward() {
            if (isWalking || inInteraction) return;
            isWalking = true;
            document.getElementById('btn-walk').disabled = true;

            const speed = 0.25;
            let moved = 0;

            function stepWalk() {
                if (moved < CHUNK_LEN) {
                    let step = Math.min(speed, CHUNK_LEN - moved);
                    moved += step;

                    chunks.forEach(chunk => {
                        chunk.position.z += step;
                        if (chunk.userData.bush && chunk.position.z + chunk.userData.bush.position.z > 3.0) {
                            chunk.userData.bush.scale.multiplyScalar(0.85); 
                        }
                    });

                    // อนิเมชันเดินขาและแขน
                    playerGroup.position.y = Math.abs(Math.sin(moved * 1.5)) * 0.2;
                    playerGroup.rotation.z = Math.sin(moved * 1.5) * 0.1; 
                    playerLegs[0].rotation.x = Math.sin(moved * 1.5) * 0.5;
                    playerLegs[1].rotation.x = -Math.sin(moved * 1.5) * 0.5;
                    playerArms[0].rotation.x = -Math.sin(moved * 1.5) * 0.5; // แขนไขว่ไปกับขา
                    playerArms[1].rotation.x = Math.sin(moved * 1.5) * 0.5;

                    requestAnimationFrame(stepWalk);
                } else {
                    playerGroup.position.y = 0;
                    playerGroup.rotation.z = 0;
                    playerLegs.forEach(leg => leg.rotation.x = 0);
                    playerArms.forEach(arm => arm.rotation.x = 0);
                    
                    const passedChunk = chunks.shift(); 
                    disposeChunk(passedChunk);
                    const lastZ = chunks[chunks.length - 1].position.z;
                    chunks.push(createChunk(lastZ - CHUNK_LEN, false));

                    isWalking = false;
                    document.getElementById('btn-walk').disabled = false;
                    
                    handleEvent(chunks[0]);
                }
            }
            stepWalk();
        }

        function handleEvent(chunk) {
            if (!chunk.userData.active) return;
            currentChunkEvent = chunk;
            inInteraction = true;
            document.getElementById('btn-walk').disabled = true;
            
            if (chunk.userData.type === 'mushroom') {
                const mType = MUSHROOM_TYPES[chunk.userData.typeKey];
                const baseSpore = Math.floor(Math.random() * (mType.sporeMax - mType.sporeMin + 1)) + mType.sporeMin;
                const finalSpore = calculateSporeGain(baseSpore);
                chunk.userData.sporeValue = finalSpore;
                chunk.userData.expValue = EXP_PER_FARM; // +5 EXP เสมอ (ตามบอท)
                document.getElementById('item-title').innerHTML = `${mType.emoji} พบ ${mType.name}!`;
                document.getElementById('item-desc').innerText = `${mType.desc} (+${finalSpore} 🍄, +${EXP_PER_FARM} EXP) — คุณจะเก็บมันหรือไม่?`;
                document.getElementById('item-panel').style.borderBottomColor = '#f1c40f';
                showPanel('item-panel');
            } 
            else if (chunk.userData.type === 'box') {
                const bType = BOX_TYPES[chunk.userData.typeKey];
                // แสดง % ของสปอร์ที่จะได้ (คำนวณจริงตอนเปิด)
                chunk.userData.boxType = bType;
                document.getElementById('item-title').innerHTML = `${bType.emoji} พบ ${bType.name}!`;
                document.getElementById('item-desc').innerText = `${bType.desc} (เปิดได้ ${bType.sporePercent*100}% ของสปอร์ที่มี) — คุณจะเปิดมันหรือไม่?`;
                document.getElementById('item-panel').style.borderBottomColor = '#' + bType.color.toString(16).padStart(6,'0');
                showPanel('item-panel');
            }
            else if (chunk.userData.type === 'monster') {
                const mType = MONSTER_TYPES[chunk.userData.typeKey];
                currentEnemy.hp = mType.hpBase + (player.level * mType.hpPerLv);
                currentEnemy.atk = mType.atkBase + (player.level * mType.atkPerLv);
                currentEnemy.mesh = chunk.userData.entity;
                currentEnemy.originalColor = mType.color;
                currentEnemy.type = mType;
                
                document.getElementById('battle-title').innerHTML = `${mType.emoji} ${mType.name} ขวางทาง!`;
                document.getElementById('battle-desc').innerText = mType.desc;
                document.getElementById('enemy-hp').innerText = currentEnemy.hp;
                document.getElementById('battle-panel').style.borderBottomColor = '#' + mType.color.toString(16).padStart(6,'0');
                showPanel('battle-panel');
            }
        }

        function collectItem(wantToTake) {
            hidePanels();
            if (wantToTake) {
                const entityType = currentChunkEvent.userData.type;
                
                if (entityType === 'mushroom') {
                    // เก็บเห็ด — ได้ spore + EXP
                    const spore = currentChunkEvent.userData.sporeValue;
                    const exp = currentChunkEvent.userData.expValue;
                    const mType = MUSHROOM_TYPES[currentChunkEvent.userData.typeKey];
                    player.spore += spore;
                    const lvUp = addExp(exp);
                    let msg = `${mType.emoji} เก็บ${mType.name}! +${spore} 🍄, +${exp} EXP`;
                    if(lvUp) msg += ` • 🎊 Level Up! Lv.${player.level}`;
                    showToast(msg);
                    updateHUD();
                    syncPlayerData();
                    
                    if(currentChunkEvent.userData.entity) {
                        const entity = currentChunkEvent.userData.entity;
                        createParticleBurst(entity.position, mType.glowColor, 25);
                        animateEntityPop(entity);
                    }
                } 
                else if (entityType === 'box') {
                    // เปิดกล่องสมบัติ — ได้ spore + โอกาส potion + โอกาส item
                    const bType = currentChunkEvent.userData.boxType;
                    // คำนวณ spore ตอนเปิดจริง (% ของสปอร์ที่มีตอนนั้น)
                    const sporeReward = Math.floor(player.spore * bType.sporePercent);
                    player.spore += sporeReward;
                    
                    let msg = `${bType.emoji} เปิด${bType.name}! +${sporeReward} 🍄`;
                    
                    // 🧪 โอกาสได้น้ำยาฟื้นฟู (30%)
                    const potionDrop = Math.random() < 0.30;
                    if (potionDrop) {
                        player.potionCount++;
                        msg += ` • 🧪 +1 น้ำยาฟื้นฟู!`;
                    }
                    
                    // ✨ โอกาสได้ไอเทม (0.75% เท่ากันทุกกล่อง — ตามบอท)
                    const droppedItem = rollItemDrop();
                    if (droppedItem) {
                        equipItem(droppedItem);
                        msg += ` • ${droppedItem.emoji} ${droppedItem.name}! (${droppedItem.lore})`;
                    }
                    
                    showToast(msg, 3500);
                    updateHUD();
                    syncPlayerData(droppedItem ? droppedItem.id : null, potionDrop ? { addPotion: true } : null);
                    
                    if(currentChunkEvent.userData.entity) {
                        const entity = currentChunkEvent.userData.entity;
                        createParticleBurst(entity.position, bType.glowColor, 35);
                        // แอนิเมชันเปิดฝากล่อง
                        animateBoxOpen(entity);
                    }
                }
            } else {
                const entityType = currentChunkEvent.userData.type;
                if(entityType === 'mushroom') {
                    showToast(`🚫 เดินผ่านไปโดยไม่เก็บเห็ด`);
                } else {
                    showToast(`🚫 เดินผ่านกล่องสมบัติโดยไม่เปิด`);
                }
            }
            inInteraction = false;
            document.getElementById('btn-walk').disabled = false;
        }

        // แอนิเมชันเห็ด pop (สำหรับเก็บเห็ด)
        function animateEntityPop(entity) {
            let scale = 1;
            const popInt = setInterval(() => {
                scale -= 0.1;
                entity.scale.set(scale, scale, scale);
                entity.position.y += 0.3;
                if (scale <= 0) clearInterval(popInt);
            }, 20);
        }

        // แอนิเมชันเปิดฝากล่อง (สำหรับกล่องสมบัติ)
        function animateBoxOpen(entity) {
            const lid = entity.userData.lid || entity.children[1];
            if(!lid) {
                // ถ้าไม่มี lid ใช้ pop แทน
                animateEntityPop(entity);
                return;
            }
            let rot = 0;
            const openInt = setInterval(() => {
                rot += 0.15;
                lid.rotation.x = -rot;
                entity.position.y += 0.05;
                if (rot >= 1.5) {
                    clearInterval(openInt);
                    // หายไปหลัง 500ms
                    setTimeout(() => {
                        let scale = 1;
                        const fadeInt = setInterval(() => {
                            scale -= 0.15;
                            entity.scale.set(scale, scale, scale);
                            if (scale <= 0) clearInterval(fadeInt);
                        }, 30);
                    }, 500);
                }
            }, 30);
        }

        // ================= BATTLE SYSTEM (animation จริง) =================
        // ลำดับการต่อสู้: 1) player charge เข้าหา + ฟัน staff
        //                2) monster โดน hit flash + knockback + damage number
        //                3) ถ้า monster ยังไม่ตาย → monster ตอบโต้ (charge/bite/spit/fire)
        //                4) player โดน hit flash + knockback + damage number
        //                5) player ถอยกลับจุดเริ่ม
        function attack() {
            if (isBattling) return; // กันกดซ้อน
            isBattling = true;
            document.getElementById('btn-attack').disabled = true;
            document.getElementById('btn-runaway').disabled = true;
            
            const mType = currentEnemy.type;
            const enemyMesh = currentEnemy.mesh;
            const playerStartZ = 4;
            const chargeZ = -1.5; // ตำแหน่งที่ player จะยืนใกล้ monster
            
            // ─── PHASE 1: Player charge เข้าหา + ฟันด้วย staff ───
            const chargeDuration = 350; // ms
            const t0 = performance.now();
            
            function playerCharge() {
                const elapsed = performance.now() - t0;
                const t = Math.min(1, elapsed / chargeDuration);
                // ease-in (เริ่มช้าแล้วเร็วขึ้น)
                const eased = t * t;
                playerGroup.position.z = playerStartZ + (chargeZ - playerStartZ) * eased;
                // ยกแขนขวาขึ้นเตรียมฟัน
                if (playerArms[1]) {
                    playerArms[1].rotation.x = -1.5 * eased; // ยกขึ้น
                }
                
                if (t < 1) {
                    requestAnimationFrame(playerCharge);
                } else {
                    // ─── PHASE 2: Slash — ฟันลงมา ───
                    playerSlash();
                }
            }
            
            function playerSlash() {
                const slashDuration = 180;
                const t0 = performance.now();
                const armStartRot = -1.5;
                const armEndRot = 1.2; // ฟันลงข้างหน้า
                
                function slashFrame() {
                    const elapsed = performance.now() - t0;
                    const t = Math.min(1, elapsed / slashDuration);
                    const eased = 1 - Math.pow(1 - t, 3); // ease-out ฟันเร็วตอนปลาย
                    if (playerArms[1]) {
                        playerArms[1].rotation.x = armStartRot + (armEndRot - armStartRot) * eased;
                    }
                    // player เอนตัวไปข้างหน้านิดหน่อย
                    if (playerGroup) {
                        playerGroup.rotation.x = -0.3 * Math.sin(t * Math.PI);
                    }
                    
                    if (t < 1) {
                        requestAnimationFrame(slashFrame);
                    } else {
                        // ปลาย slash = โดน monster
                        applyPlayerDamageToEnemy();
                    }
                }
                slashFrame();
            }
            
            function applyPlayerDamageToEnemy() {
                // คำนวณดาเมจ (±20% variance)
                const baseDmg = player.atk;
                const dmg = Math.max(1, Math.floor(baseDmg * (0.8 + Math.random() * 0.4)));
                currentEnemy.hp -= dmg;
                if (currentEnemy.hp < 0) currentEnemy.hp = 0;
                document.getElementById('enemy-hp').innerText = currentEnemy.hp;
                
                // เอฟเฟกต์ monster โดนตี
                if (enemyMesh) {
                    // hit flash — เปลี่ยนสี body เป็นขาว 200ms
                    const bodyMesh = enemyMesh.children[0];
                    let originalEmissive = null;
                    if(bodyMesh && bodyMesh.material) {
                        bodyMesh.material.color.setHex(0xffffff);
                        if(bodyMesh.material.emissive) {
                            originalEmissive = bodyMesh.material.emissive.getHex();
                            bodyMesh.material.emissive.setHex(0xffffff);
                            bodyMesh.material.emissiveIntensity = 0.8;
                        }
                    }
                    // knockback — กระเด็นถอยหลัง + ลอย
                    const knockbackStart = performance.now();
                    const knockbackDuration = 250;
                    const enemyOriginalY = enemyMesh.position.y;
                    function knockbackFrame() {
                        const elapsed = performance.now() - knockbackStart;
                        const t = Math.min(1, elapsed / knockbackDuration);
                        const eased = 1 - Math.pow(1 - t, 2);
                        enemyMesh.position.z = -2.5 + 0.8 * Math.sin(t * Math.PI); // ถอยไปกลับ
                        enemyMesh.position.y = enemyOriginalY + 0.4 * Math.sin(t * Math.PI); // ลอยขึ้น
                        if (t < 1) {
                            requestAnimationFrame(knockbackFrame);
                        } else {
                            // คืนสี
                            if(bodyMesh && bodyMesh.material) {
                                bodyMesh.material.color.setHex(currentEnemy.originalColor);
                                if(originalEmissive !== null && bodyMesh.material.emissive) {
                                    bodyMesh.material.emissive.setHex(originalEmissive);
                                }
                            }
                        }
                    }
                    knockbackFrame();
                    
                    // particle ตอนโดน
                    createParticleBurst(enemyMesh.position, currentEnemy.type.color, 14);
                }
                
                // damage number floating text
                showDamageNumber(dmg, enemyMesh ? enemyMesh.position : new THREE.Vector3(0,1.5,-2.5), 0xffeb3b);
                
                cameraShake = 0.3;
                
                // ตรวจ monster ตาย?
                if (currentEnemy.hp <= 0) {
                    setTimeout(() => {
                        // 🍄 รางวัลสปอร์ + EXP ตาม /farm
                        const sporeGain = Math.floor(Math.random() * (mType.sporeWinMax - mType.sporeWinMin + 1)) + mType.sporeWinMin;
                        player.spore += sporeGain;
                        const lvUp = addExp(EXP_MONSTER_WIN); // +10 EXP จากการชนะมอนสเตอร์
                        let msg = `${mType.emoji} ชนะ${mType.name}! +${sporeGain} 🍄, +${EXP_MONSTER_WIN} EXP`;
                        if(lvUp) msg += ` • 🎊 Level Up! Lv.${player.level}`;
                        showToast(msg);
                        updateHUD();
                        syncPlayerData();
                        // คืนแขน + ถอย player กลับ
                        playerReturnToStart(() => endInteraction(true));
                    }, 350);
                } else {
                    // ─── PHASE 3: Monster ตอบโต้ ───
                    setTimeout(() => monsterCounterAttack(mType, enemyMesh), 350);
                }
            }
            
            function monsterCounterAttack(mType, enemyMesh) {
                const counterDuration = 450;
                const t0 = performance.now();
                const typeKey = mType.key;
                
                // เก็บสถานะเริ่มต้น
                const enemyStartPos = enemyMesh.position.clone();
                const enemyStartRotY = enemyMesh.rotation.y;
                
                function counterFrame() {
                    const elapsed = performance.now() - t0;
                    const t = Math.min(1, elapsed / counterDuration);
                    
                    // animation ตาม type ของ monster
                    switch(typeKey) {
                        case 'caterpillar': {
                            // หนอนเลื้อยพุ่งเข้าใส่
                            const lunge = Math.sin(t * Math.PI);
                            enemyMesh.position.z = enemyStartPos.z + 1.8 * lunge;
                            if(enemyMesh.userData.head) {
                                enemyMesh.userData.head.rotation.x = -0.4 * lunge;
                            }
                            break;
                        }
                        case 'bat': {
                            // ค้างคาวบินก้มลงมากัด
                            const dive = Math.sin(t * Math.PI);
                            enemyMesh.position.y = enemyStartPos.y + 1.0 * dive;
                            enemyMesh.position.z = enemyStartPos.z + 1.2 * dive;
                            if(enemyMesh.userData.wingL && enemyMesh.userData.wingR) {
                                const flap = Math.sin(t * 20) * 0.8;
                                enemyMesh.userData.wingL.rotation.x = flap;
                                enemyMesh.userData.wingR.rotation.x = -flap;
                            }
                            break;
                        }
                        case 'boar': {
                            // หมูพุ่งชน
                            const charge = Math.sin(t * Math.PI);
                            // ชนแรงตอนกลาง
                            const chargeForce = t < 0.5 ? charge * 2 : (1 - t) * 2;
                            enemyMesh.position.z = enemyStartPos.z + 2.0 * chargeForce;
                            if(enemyMesh.userData.head) {
                                enemyMesh.userData.head.rotation.x = -0.3 * charge;
                            }
                            break;
                        }
                        case 'dragon': {
                            // มังกรเหวี่ยงหัว + พ่นไฟ (particle)
                            const headSwing = Math.sin(t * Math.PI);
                            if(enemyMesh.userData.head) {
                                enemyMesh.userData.head.rotation.y = headSwing * 0.5;
                                enemyMesh.userData.head.rotation.x = -0.3 * headSwing;
                            }
                            // พ่นไฟตอนกลาง animation
                            if (t > 0.4 && t < 0.6 && !enemyMesh.userData._fireSpawned) {
                                enemyMesh.userData._fireSpawned = true;
                                // spawn ไฟที่ปากมังกร
                                const mouthPos = new THREE.Vector3();
                                if(enemyMesh.userData.head) {
                                    enemyMesh.userData.head.getWorldPosition(mouthPos);
                                    mouthPos.y -= 0.2;
                                } else {
                                    mouthPos.copy(enemyMesh.position);
                                }
                                createParticleBurst(mouthPos, 0xff4500, 25);
                                createParticleBurst(mouthPos, 0xffd700, 15);
                            }
                            break;
                        }
                    }
                    
                    if (t < 1) {
                        requestAnimationFrame(counterFrame);
                    } else {
                        // reset monster pose
                        enemyMesh.position.copy(enemyStartPos);
                        if(enemyMesh.userData.head) {
                            enemyMesh.userData.head.rotation.set(0, 0, 0);
                        }
                        enemyMesh.userData._fireSpawned = false;
                        applyMonsterDamageToPlayer();
                    }
                }
                counterFrame();
            }
            
            function applyMonsterDamageToPlayer() {
                const dmg = currentEnemy.atk;
                player.hp -= dmg;
                
                // เอฟเฟกต์ player โดนตี — flash สีแดง + knockback ถอยหลัง
                const playerFlashStart = performance.now();
                const flashDuration = 350;
                const playerStartZ = playerGroup.position.z;
                let originalCapColor = null;
                if(capMaterial) originalCapColor = capMaterial.color.getHex();
                
                function playerHitFrame() {
                    const elapsed = performance.now() - playerFlashStart;
                    const t = Math.min(1, elapsed / flashDuration);
                    // กระพริบแดง
                    if(capMaterial && originalCapColor !== null) {
                        const flash = Math.sin(t * Math.PI * 4) > 0;
                        capMaterial.color.setHex(flash ? 0xff0000 : originalCapColor);
                    }
                    // knockback ถอยหลัง
                    playerGroup.position.z = playerStartZ + 0.5 * Math.sin(t * Math.PI);
                    // เอนตัวถอย
                    playerGroup.rotation.x = 0.3 * Math.sin(t * Math.PI);
                    
                    if (t < 1) {
                        requestAnimationFrame(playerHitFrame);
                    } else {
                        // คืนสี
                        if(capMaterial && originalCapColor !== null) {
                            capMaterial.color.setHex(originalCapColor);
                        }
                        playerGroup.rotation.x = 0;
                        
                        // damage number สีแดงเหนือ player
                        showDamageNumber(dmg, new THREE.Vector3(playerGroup.position.x, 2, playerGroup.position.z), 0xff5252);
                        
                        showToast(`${mType.emoji} โดน${mType.name}โจมตี! -${dmg} HP`);
                        updateHUD();
                        cameraShake = 0.35;
                        
                        // ตรวจ player ตาย?
                        if (player.hp <= 0) {
                            player.hp = 0;
                            updateHUD();
                            // ปลดล็อก battle แล้วเรียก death sequence
                            isBattling = false;
                            document.getElementById('btn-attack').disabled = false;
                            document.getElementById('btn-runaway').disabled = false;
                            handlePlayerDeath(mType);
                        } else {
                            // ─── PHASE 4: player ถอยกลับจุดเริ่ม ───
                            playerReturnToStart(() => {
                                isBattling = false;
                                document.getElementById('btn-attack').disabled = false;
                                document.getElementById('btn-runaway').disabled = false;
                            });
                        }
                    }
                }
                playerHitFrame();
            }
            
            function playerReturnToStart(callback) {
                const returnDuration = 300;
                const t0 = performance.now();
                const startZ = playerGroup.position.z;
                const endZ = playerStartZ;
                // ค่อยๆ คืนแขนขวาสู่ท่าปกติ
                const armStartRot = playerArms[1] ? playerArms[1].rotation.x : 0;
                
                function returnFrame() {
                    const elapsed = performance.now() - t0;
                    const t = Math.min(1, elapsed / returnDuration);
                    const eased = 1 - Math.pow(1 - t, 2);
                    playerGroup.position.z = startZ + (endZ - startZ) * eased;
                    if (playerArms[1]) {
                        playerArms[1].rotation.x = armStartRot * (1 - eased);
                    }
                    playerGroup.rotation.x = 0;
                    
                    if (t < 1) {
                        requestAnimationFrame(returnFrame);
                    } else {
                        playerGroup.position.z = endZ;
                        if (playerArms[1]) playerArms[1].rotation.x = 0;
                        if (callback) callback();
                    }
                }
                returnFrame();
            }
            
            // เริ่ม battle sequence
            playerCharge();
        }

        // 🌟 Floating damage number — แสดงตัวเลขดาเมจลอยขึ้นแล้วหาย
        function showDamageNumber(amount, worldPos, color) {
            // สร้าง canvas texture ขนาดใหญ่
            const canvas = document.createElement('canvas');
            canvas.width = 256; canvas.height = 128;
            const ctx = canvas.getContext('2d');
            ctx.font = 'bold 80px Mitr, Arial Black, Arial';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            const text = '-' + amount;
            // เงาหนา
            ctx.fillStyle = 'rgba(0,0,0,0.95)';
            ctx.fillText(text, 130, 66);
            ctx.fillText(text, 128, 64);
            // ตัวเลขสีสด
            const hex = '#' + color.toString(16).padStart(6, '0');
            ctx.fillStyle = hex;
            ctx.fillText(text, 128, 64);
            // ขอบสีขาว
            ctx.strokeStyle = '#ffffff';
            ctx.lineWidth = 3;
            ctx.strokeText(text, 128, 64);
            
            const texture = new THREE.CanvasTexture(canvas);
            texture.minFilter = THREE.LinearFilter;
            const mat = new THREE.SpriteMaterial({ 
                map: texture, transparent: true, depthTest: false,
                depthWrite: false
            });
            const sprite = new THREE.Sprite(mat);
            sprite.position.copy(worldPos);
            sprite.position.y += 1.8;
            // ขนาดใหญ่ขึ้น
            sprite.scale.set(2.2, 1.1, 1);
            sprite.renderOrder = 999;
            scene.add(sprite);
            
            // animate: กระโดดขึ้น + fade
            const t0 = performance.now();
            const duration = 1200;
            const startY = sprite.position.y;
            function animDmg() {
                const elapsed = performance.now() - t0;
                const t = elapsed / duration;
                if (t >= 1) {
                    scene.remove(sprite);
                    texture.dispose();
                    mat.dispose();
                    return;
                }
                // กระโดดขึ้นแบบ parabola ตอนแรก แล้วลอยช้าๆ
                const jump = t < 0.3 ? Math.sin(t / 0.3 * Math.PI) * 0.8 : 0;
                const float = t * 0.8;
                sprite.position.y = startY + jump + float;
                // fade out ตอนท้าย
                sprite.material.opacity = t < 0.7 ? 1 : 1 - (t - 0.7) / 0.3;
                requestAnimationFrame(animDmg);
            }
            animDmg();
        }

        // 💀 ระบบตาย — เสียสปอร์ flat (ตาม /farm) + respawn ที่จุดเริ่มต้น
        function handlePlayerDeath(mType) {
            // 🍄 เสียสปอร์แบบ flat ตาม sporeLossMin/Max ของ monster
            const sporeLost = Math.floor(Math.random() * (mType.sporeLossMax - mType.sporeLossMin + 1)) + mType.sporeLossMin;
            const actualLost = Math.min(sporeLost, player.spore); // ไม่เป็นลบ
            player.spore = Math.max(0, player.spore - actualLost);
            syncPlayerData(); // sync ยอด spore ใหม่ (หลังเสีย)
            
            // แสดง toast ตาย
            showToast(`💀 พ่ายแพ้ต่อ${mType.name}! เสีย ${actualLost} 🍄 — กลับไปเริ่มใหม่...`, 4000);
            
            // ปิด popup
            hidePanels();
            
            // หน่วงเวลาเล็กน้อยก่อน respawn
            setTimeout(() => {
                respawnPlayer();
                inInteraction = false;
                document.getElementById('btn-walk').disabled = false;
            }, 1500);
        }

        // 🔄 รีเซ็ตเกม — สร้าง chunks ใหม่ทั้งหมด + ฟื้น HP เต็ม
        function respawnPlayer() {
            // ทำลาย chunks เดิมทั้งหมด
            chunks.forEach(c => disposeChunk(c));
            chunks = [];
            
            // สร้าง chunks ใหม่เหมือนตอนเริ่มเกม
            chunks.push(createChunk(4, true));   
            chunks.push(createChunk(-8, false)); 
            chunks.push(createChunk(-20, false));
            chunks.push(createChunk(-32, false));
            
            // รีเซ็ตตำแหน่งผู้เล่น + ฟื้น HP เต็ม
            playerGroup.visible = true;
            playerGroup.position.set(0, 0, 4);
            playerGroup.rotation.set(0, 0, 0);
            playerGroup.scale.set(1, 1, 1);
            playerLegs.forEach(leg => leg.rotation.x = 0);
            playerArms.forEach(arm => arm.rotation.x = 0);
            
            // รีเซ็ต stats จาก level + ฟื้น HP เต็ม
            recalcStatsFromLevel();
            player.hp = player.maxHp;
            isWalking = false;
            inInteraction = false;
            currentEnemy.mesh = null;
            currentEnemy.type = null;
            currentChunkEvent = null;
            
            updateHUD();
            
            // เอฟเฟกต์ respawn — particle สีเขียวรอบตัวผู้เล่น
            createParticleBurst(new THREE.Vector3(0, 1, 4), 0x2ecc71, 30);
            cameraShake = 0.15;
        }

            showToast(`💨 วิ่งหนีจากมอนสเตอร์สำเร็จ!`);
            endInteraction(false);

        function endInteraction(won) {
            inInteraction = false;
            isBattling = false;
            hidePanels();
            document.getElementById('btn-walk').disabled = false;
            document.getElementById('btn-attack').disabled = false;
            document.getElementById('btn-runaway').disabled = false;
            if (won && currentEnemy.mesh) {
                const deathColor = currentEnemy.type ? currentEnemy.type.color : 0x9b59b6;
                createParticleBurst(currentEnemy.mesh.position, deathColor, 35);
                let scale = 1;
                const deathInt = setInterval(() => {
                    scale -= 0.1;
                    if (currentEnemy.mesh) {
                        currentEnemy.mesh.scale.set(scale, scale, scale);
                        currentEnemy.mesh.rotation.y += 0.8;
                        currentEnemy.mesh.position.y -= 0.1;
                    }
                    if (scale <= 0) clearInterval(deathInt);
                }, 30);
            }
        }

        // ================= VFX & UTILITIES =================
        function createParticleBurst(position, color, count) {
            const geometry = new THREE.IcosahedronGeometry(0.15, 0);
            const material = new THREE.MeshStandardMaterial({ color: color, emissive: color, emissiveIntensity: 0.5, flatShading: true });
            const particles = [];
            
            for(let i=0; i<count; i++) {
                const p = new THREE.Mesh(geometry, material.clone());
                p.position.copy(position);
                p.castShadow = false;
                p.velocity = new THREE.Vector3(
                    (Math.random() - 0.5) * 0.5,
                    Math.random() * 0.5,
                    (Math.random() - 0.5) * 0.5
                );
                p.life = 1.0;
                scene.add(p);
                particles.push(p);
            }
            particleSystems.push(particles);
        }

        function updateParticles() {
            for(let i = particleSystems.length - 1; i >= 0; i--) {
                const sys = particleSystems[i];
                let allDead = true;
                for(let j=0; j<sys.length; j++) {
                    const p = sys[j];
                    if(p.life > 0) {
                        allDead = false;
                        p.position.add(p.velocity);
                        p.velocity.y -= 0.02; 
                        p.life -= 0.03;
                        p.scale.setScalar(p.life);
                        p.material.opacity = p.life;
                        p.material.transparent = true;
                    }
                }
                if(allDead) {
                    sys.forEach(p => {
                        scene.remove(p);
                        p.geometry.dispose();
                        p.material.dispose();
                    });
                    particleSystems.splice(i, 1);
                }
            }
        }

        function selectColor(c, el) { 
            selectedColor = c; 
            if(capMaterial) capMaterial.color.setHex(c);
            document.querySelectorAll('.color-dot').forEach(d => d.classList.remove('selected'));

        }

        // ================= AUTH + SYNC SYSTEM =================
        // เชื่อมต่อกับ SporeNet bot API เพื่อ sync ข้อมูล
        // ล็อกอินด้วย Discord OAuth2 + เช็คสมาชิกเซิร์ฟเวอร์

        // ⚙️ config — จะถูก override โดย window.GAME_CONFIG (ถ้ามี)
        const API_BASE = (window.GAME_CONFIG && window.GAME_CONFIG.API_BASE) || '';
        let authToken = localStorage.getItem('sporenet_token') || null;
        let currentUser = null;

        // ดึง auth status + config จาก API
        async function apiGet(path) {
            const res = await fetch(`${API_BASE}${path}`, {
                headers: authToken ? { 'Authorization': `Bearer ${authToken}` } : {},
            });
            return res;
        }

        async function apiPost(path, body) {
            const res = await fetch(`${API_BASE}${path}`, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    ...(authToken ? { 'Authorization': `Bearer ${authToken}` } : {}),
                },
                body: JSON.stringify(body),
            });
            return res;
        }

        // 🚀 เริ่มล็อกอิน — redirect ไป Discord OAuth2
        async function startDiscordLogin() {
            try {
                const res = await apiGet('/api/auth/login');
                const data = await res.json();
                if (data.url) {
                    window.location.href = data.url;
                } else {
                    showLoginError(data.message || 'ไม่สามารถเริ่มล็อกอินได้');
                }
            } catch (err) {
                showLoginError('เชื่อมต่อ API ไม่ได้: ' + err.message);
            }
        }

        // 📥 รับ callback จาก Discord (?code=...&state=...)
        async function handleAuthCallback() {
            const params = new URLSearchParams(window.location.search);
            const code = params.get('code');
            if (!code) return false;

            // แสดงหน้ากำลังล็อกอิน
            showLoginScreen('loading');

            try {
                const res = await apiPost('/api/auth/callback', { code });
                const data = await res.json();

                if (res.ok && data.token) {
                    authToken = data.token;
                    currentUser = data.user;
                    localStorage.setItem('sporenet_token', authToken);
                    // ลบ query string
                    window.history.replaceState({}, document.title, window.location.pathname);
                    return true;
                } else if (data.error === 'not_in_guild') {
                    showLoginError(`${data.message}\n\nGuild ID: ${data.guildId}\n\nกรุณาเข้าร่วมเซิร์ฟเวอร์ Discord ก่อน แล้วลองใหม่อีกครั้ง`);
                } else {
                    showLoginError(data.message || `ล็อกอินไม่สำเร็จ: ${data.error || 'unknown error'}`);
                }
            } catch (err) {
                showLoginError('เชื่อมต่อ API ไม่ได้: ' + err.message);
            }
            return false;
        }

        // ✅ เช็คว่ามี session token ที่ถูกต้องไหม
        async function checkSession() {
            if (!authToken) return false;
            try {
                const res = await apiGet('/api/auth/me');
                if (res.ok) {
                    currentUser = await res.json();
                    return true;
                }
                // token หมดอายุ → ลบทิ้ง
                localStorage.removeItem('sporenet_token');
                authToken = null;
                return false;
            } catch {
                return false;
            }
        }

        // 📊 ดึงข้อมูลผู้เล่นจาก API (sync จาก bot)
        async function fetchPlayerData() {
            try {
                const res = await apiGet('/api/player');
                if (!res.ok) return null;
                const data = await res.json();
                return data;
            } catch {
                return null;
            }
        }

        // 💾 ส่งข้อมูลผู้เล่นกลับไป API (sync ไป bot) — real-time
        let syncTimer = null;
        function syncPlayerData(addItemId, options) {
            // debounce 300ms — กัน spam API
            if (syncTimer) clearTimeout(syncTimer);
            const pendingAddItem = addItemId;
            const opts = options || {};
            syncTimer = setTimeout(async () => {
                try {
                    const body = {
                        spore: player.spore,
                        level: player.level,
                        exp: player.farmExp,
                    };
                    if (pendingAddItem) body.addItem = pendingAddItem;
                    if (opts.addPotion) body.addPotion = true;
                    if (opts.usePotion) body.usePotion = true;
                    await apiPost('/api/player', body);
                } catch (err) {
                    console.warn('[sync] failed:', err);
                }
            }, 300);
        }

        // 📥 โหลดข้อมูลจาก API มาใส่ใน player object
        async function loadPlayerFromAPI() {
            const data = await fetchPlayerData();
            if (!data) return false;
            // sync ข้อมูลจาก bot → game
            player.spore = data.spore || 0;
            player.level = data.level || 1;
            player.farmExp = data.exp || 0;
            player.potionCount = data.potionCount || 0;
            // คำนวณ stats ใหม่ตาม level
            recalcStatsFromLevel();
            // แมป inventory — นับ items ที่ได้รับ (ไม่รวม potion)
            if (data.items && Array.isArray(data.items)) {
                player.items = data.items.map(i => i.itemId);
            }
            // อัปเดต buffs จาก items
            recalcBuffsFromItems();
            return true;
        }

        // คำนวณ buffs ใหม่จาก items list (เพราะ bot store เก็บเป็น itemId array)
        function recalcBuffsFromItems() {
            // reset
            player.sporeBonusPercent = 0;
            player.sporeBonusFlat = 0;
            player.expBonusPercent = 0;
            player.attackBonusPercent = 0;
            // สะสมใหม่
            player.items.forEach(itemId => {
                const item = ITEMS_POOL.find(i => i.id === itemId);
                if (!item) return;
                switch(item.buffType) {
                    case 'attack_percent': player.attackBonusPercent += item.buffValue; break;
                    case 'spore_percent':  player.sporeBonusPercent  += item.buffValue; break;
                    case 'spore_flat':     player.sporeBonusFlat     += item.buffValue; break;
                    case 'exp_percent':    player.expBonusPercent    += item.buffValue; break;
                }
            });
        }

        // 🚪 ล็อกเอาท์
        function logout() {
            localStorage.removeItem('sporenet_token');
            authToken = null;
            currentUser = null;
            location.reload();
        }

        function showLoginError(msg) {
            const errEl = document.getElementById('login-error');
            if (errEl) errEl.innerText = msg;
            showLoginScreen('form');
            // ตั้ง msg อีกครั้งเพราะ innerHTML เขียนทับ
            setTimeout(() => {
                const err = document.getElementById('login-error');
                if (err) err.innerText = msg;
            }, 50);
        }

        function startGame() {
            const nameInput = document.getElementById('hero-name');
            // ถ้ามี currentUser ใช้ชื่อจาก Discord แทน
            const name = currentUser ? (currentUser.username || currentUser.globalName || 'Player') : (nameInput ? nameInput.value : 'Player');
            document.getElementById('display-name').innerText = name;
            document.querySelector('.ui-layer').style.display = 'none';
            document.getElementById('game-hud').style.display = 'block';
            // เพิ่มปุ่ม logout ที่มุมขวาบน
            addLogoutButton();
            updateHUD();
        }

        function addLogoutButton() {
            if (document.getElementById('btn-logout')) return;
            const btn = document.createElement('button');
            btn.id = 'btn-logout';
            btn.innerText = '🚪';
            btn.title = 'ล็อกเอาท์';
            btn.style.cssText = 'position: absolute; top: 20px; left: 200px; pointer-events: auto; background: rgba(0,0,0,0.6); color: white; border: 1px solid rgba(255,255,255,0.2); border-radius: 10px; width: 36px; height: 36px; font-size: 16px; cursor: pointer; z-index: 11;';
            btn.addEventListener('click', logout);
            document.getElementById('game-hud').appendChild(btn);
        }

        function updateHUD() {
            document.getElementById('hp-text').innerText = `${player.hp}/${player.maxHp}`;
            document.getElementById('hp-bar').style.width = `${(player.hp/player.maxHp)*100}%`;
            document.getElementById('display-spore').innerText = player.spore.toLocaleString();
            document.getElementById('display-lv').innerText = player.level;
            document.getElementById('display-potion').innerText = player.potionCount;
            document.getElementById('display-items').innerText = player.items.length;
            const expNeeded = expNeededForLevel(player.level);
            const expPct = (player.farmExp / expNeeded) * 100;
            document.getElementById('farm-exp-text').innerText = `${player.farmExp}/${expNeeded}`;
            document.getElementById('farm-exp-bar').style.width = `${expPct}%`;
            
            // แสดง buffs สะสม
            const buffsEl = document.getElementById('buffs-display');
            let buffs = [];
            if(player.attackBonusPercent > 0) buffs.push(`⚔️+${player.attackBonusPercent}%`);
            if(player.sporeBonusPercent > 0) buffs.push(`🍄+${player.sporeBonusPercent}%`);
            if(player.sporeBonusFlat > 0) buffs.push(`🍄+${player.sporeBonusFlat}`);
            if(player.expBonusPercent > 0) buffs.push(`⭐+${player.expBonusPercent}%`);
            buffsEl.innerText = buffs.length > 0 ? 'Buffs: ' + buffs.join(' ') : '';
            
            // ปุ่ม potion — สีซีดถ้าไม่มี
            const btnPotion = document.getElementById('btn-potion');
            if(btnPotion) {
                btnPotion.style.opacity = player.potionCount > 0 ? '1' : '0.4';
            }
        }

        function showToast(msg, duration) {
            const container = document.getElementById('toast-container');
            if(!container) return;
            
            // สร้าง toast element ใหม่
            const toast = document.createElement('div');
            toast.className = 'toast';
            toast.innerText = msg;
            container.appendChild(toast);
            
            // trigger animation (reflow ก่อน add class)
            void toast.offsetWidth;
            toast.classList.add('show');
            
            const dur = duration || 2500;
            // auto-remove
            setTimeout(() => {
                toast.classList.remove('show');
                setTimeout(() => {
                    if(toast.parentNode) toast.parentNode.removeChild(toast);
                }, 400); // รอ transition จบ
            }, dur);
            
            // จำกัดจำนวน toast สูงสุด 4 ตัว — ลบของเก่าออก
            while(container.children.length > 4) {
                const oldest = container.firstChild;
                oldest.classList.remove('show');
                setTimeout(() => { if(oldest.parentNode) oldest.parentNode.removeChild(oldest); }, 400);
                break;
            }
        }

        function showPanel(id) {
            document.getElementById(id).classList.add('active');
            // ซ่อนปุ่ม walk ตอนมี popup เพื่อไม่ให้บัง
            document.querySelector('.controls').style.display = 'none';
        }

        function hidePanels() {
            document.getElementById('battle-panel').classList.remove('active');
            document.getElementById('item-panel').classList.remove('active');
            // แสดงปุ่ม walk กลับมา
            document.querySelector('.controls').style.display = 'block';
        }

        function animate() {
            requestAnimationFrame(animate);
            const time = Date.now() * 0.003;
            
            chunks.forEach(c => {
                if(c.userData.entity && c.userData.entity.userData.isAnimating) {
                    const ent = c.userData.entity;
                    const ud = ent.userData;
                    
                    // ลอยขึ้นลง + หมุนรอบตัว
                    ent.position.y = ud.yOffset + Math.abs(Math.sin(time)) * 0.15;
                    ent.rotation.y += 0.02;
                    
                    // animation เฉพาะ type
                    if(ud.kind === 'monster') {
                        switch(ud.typeKey) {
                            case 'caterpillar': {
                                // หนอนเลื้อย — ขยับปมทีละข้อ
                                if(ud.segments) {
                                    ud.segments.forEach((seg, i) => {
                                        seg.position.y = Math.sin(time * 2 - i * 0.6) * 0.1;
                                    });
                                }
                                break;
                            }
                            case 'bat': {
                                // ค้างคาว — กระพือปีก + ลอยสูง
                                if(ud.wingL && ud.wingR) {
                                    const flap = Math.sin(time * 6) * 0.6;
                                    ud.wingL.rotation.x = flap;
                                    ud.wingR.rotation.x = -flap;
                                }
                                ent.position.y = ud.yOffset + 0.4 + Math.sin(time * 1.5) * 0.2;
                                break;
                            }
                            case 'boar': {
                                // หมูป่า — สะบัดหัว + หายใจหนัก
                                if(ud.head) {
                                    ud.head.rotation.y = Math.sin(time * 2) * 0.15;
                                }
                                if(ud.body) {
                                    ud.body.scale.y = 1 + Math.sin(time * 3) * 0.05;
                                }
                                break;
                            }
                            case 'dragon': {
                                // มังกร — กระพือปีกช้าๆ + สะบัดหัว + ลอยสูง
                                if(ud.wingL && ud.wingR) {
                                    const flap = Math.sin(time * 1.5) * 0.4;
                                    ud.wingL.rotation.x = flap;
                                    ud.wingR.rotation.x = -flap;
                                }
                                if(ud.head) {
                                    ud.head.rotation.y = Math.sin(time * 0.8) * 0.2;
                                }
                                ent.position.y = ud.yOffset + 0.3 + Math.sin(time * 1.2) * 0.25;
                                break;
                            }
                        }
                    } else if(ud.kind === 'mushroom') {
                        switch(ud.typeKey) {
                            case 'magic': {
                                // เห็ดเรืองแสง — หายใจเรืองแสง
                                if(ud.cap && ud.cap.material) {
                                    ud.cap.material.emissiveIntensity = 0.6 + Math.abs(Math.sin(time * 2)) * 0.6;
                                }
                                break;
                            }
                            case 'golden': {
                                // เห็ดทอง — อัญมณีกลางยอดหมุน + แวบแสง
                                if(ud.topJewel) {
                                    ud.topJewel.rotation.y += 0.05;
                                    ud.topJewel.rotation.x += 0.03;
                                }
                                if(ud.cap && ud.cap.material) {
                                    ud.cap.material.emissiveIntensity = 0.4 + Math.abs(Math.sin(time * 1.5)) * 0.5;
                                }
                                break;
                            }
                            case 'straw': {
                                // เห็ดฟาง — แค่ส่ายเล็กน้อย
                                if(ud.cap) {
                                    ud.cap.rotation.z = Math.sin(time) * 0.05;
                                }
                                break;
                            }
                        }
                    } else if(ud.kind === 'box') {
                        switch(ud.typeKey) {
                            case 'common': {
                                // กล่องธรรมดา — ส่ายเล็กน้อย
                                if(ud.lid) {
                                    ud.lid.rotation.z = 0.05 + Math.sin(time) * 0.03;
                                }
                                break;
                            }
                            case 'iron': {
                                // กล่องเหล็ก — แวบแสงโลหะ
                                if(ent.children[0] && ent.children[0].material) {
                                    ent.children[0].material.emissiveIntensity = 0.2 + Math.abs(Math.sin(time * 1.5)) * 0.3;
                                    if(!ent.children[0].material.emissive.getHex()) {
                                        ent.children[0].material.emissive.setHex(0x90a4ae);
                                    }
                                }
                                break;
                            }
                            case 'gold': {
                                // กล่องทอง — อัญมณีกลางหมุน + แวบแสง
                                if(ud.centerJewel) {
                                    ud.centerJewel.rotation.y += 0.04;
                                    ud.centerJewel.rotation.x += 0.02;
                                }
                                if(ud.top) {
                                    ud.top.rotation.y += 0.03;
                                }
                                if(ent.children[0] && ent.children[0].material) {
                                    ent.children[0].material.emissiveIntensity = 0.3 + Math.abs(Math.sin(time * 1.2)) * 0.4;
                                }
                                break;
                            }
                        }
                    }
                }
            });

            updateParticles();

            if (cameraShake > 0) {
                camera.position.x += (Math.random() - 0.5) * cameraShake;
                camera.position.y += (Math.random() - 0.5) * cameraShake;
                cameraShake -= 0.02;
            } else {
                camera.position.x += (6.5 - camera.position.x) * 0.1;
                camera.position.y += (9.0 - camera.position.y) * 0.1;
            }
            camera.lookAt(0, 1.5, 0);

            renderer.render(scene, camera);
        }

        // ================= EVENT LISTENERS =================
        async function initAuth() {
            // 1. ถ้ามี ?code= ใน URL = Discord callback
            const isCallback = await handleAuthCallback();
            if (isCallback) {
                // login สำเร็จ → โหลดข้อมูล + เริ่มเกม
                await loadPlayerFromAPI();
                startGame();
                return;
            }
            // 2. ถ้ามี token ใน localStorage → ตรวจ session
            if (authToken) {
                const valid = await checkSession();
                if (valid) {
                    await loadPlayerFromAPI();
                    startGame();
                    return;
                }
            }
            // 3. ไม่มี session → แสดงหน้าล็อกอิน
            showLoginScreen('form');
        }

        window.onload = function() {
            init3D();
            
            document.getElementById('btn-start').addEventListener('click', startGame);
            document.getElementById('btn-walk').addEventListener('click', walkForward);
            document.getElementById('btn-attack').addEventListener('click', attack);
            document.getElementById('btn-runaway').addEventListener('click', runAway);
            document.getElementById('btn-collect').addEventListener('click', () => collectItem(true));
            document.getElementById('btn-ignore').addEventListener('click', () => collectItem(false));
            document.getElementById('btn-potion').addEventListener('click', usePotion);

            document.querySelectorAll('.color-dot').forEach(dot => {
                dot.addEventListener('click', function() {
                    const colorHex = parseInt(this.dataset.color);
                    selectColor(colorHex, this);
                });
            });

            // เริ่ม auth flow (async)
            initAuth();
        };
    </script>
