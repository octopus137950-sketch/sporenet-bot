<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mushroom Voxel - Endless Adventure</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Mitr:wght@400;600;700&display=swap');
        
        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
        body, html { width: 100%; height: 100%; overflow: hidden; background-color: #1a1a2e; font-family: 'Mitr', sans-serif; }
        
        #canvas-container { width: 100%; height: 100%; position: absolute; top: 0; left: 0; z-index: 1; }
        
        .vignette {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            z-index: 4; pointer-events: none;
            box-shadow: inset 0 0 200px rgba(0,0,0,0.8);
        }
        
        .ui-layer {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            z-index: 10; pointer-events: none;
            display: flex; justify-content: center; align-items: center;
        }
        
        .card {
            background: rgba(20, 30, 40, 0.7); backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.2); padding: 40px; border-radius: 25px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.8), inset 0 1px 0 rgba(255,255,255,0.2);
            text-align: center; width: 90%; max-width: 400px; pointer-events: auto; color: white;
            animation: popIn 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        h1 { font-size: 32px; color: #fff; text-shadow: 0 4px 15px rgba(231, 76, 60, 0.6); letter-spacing: 1px; }
        h2 { font-size: 14px; color: #bdc3c7; margin-bottom: 25px; text-transform: uppercase; letter-spacing: 2px; }
        
        input {
            width: 100%; padding: 14px; margin: 10px 0;
            background: rgba(0,0,0,0.5); border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 12px; color: white; font-size: 16px; text-align: center;
            font-family: 'Mitr', sans-serif; outline: none; transition: 0.2s;
        }
        input:focus { border-color: #f1c40f; box-shadow: 0 0 15px rgba(241, 196, 15, 0.3); }

        .btn {
            width: 100%; padding: 14px; margin-top: 15px;
            border: none; border-radius: 12px;
            background: linear-gradient(180deg, #2ecc71 0%, #27ae60 100%);
            color: white; font-size: 18px; font-weight: 600;
            cursor: pointer; box-shadow: 0 6px 0 #1e8449, inset 0 1px 0 rgba(255,255,255,0.3); transition: 0.1s;
            font-family: 'Mitr', sans-serif;
            text-shadow: 0 1px 2px rgba(0,0,0,0.3);
        }
        .btn:active { transform: translateY(4px); box-shadow: 0 2px 0 #1e8449, inset 0 1px 0 rgba(255,255,255,0.3); }
        .btn:disabled { opacity: 0.5; cursor: not-allowed; transform: none; box-shadow: 0 6px 0 #1e8449; }
        .btn-atk { background: linear-gradient(180deg, #e74c3c 0%, #c0392b 100%); box-shadow: 0 6px 0 #922b21, inset 0 1px 0 rgba(255,255,255,0.3); }
        .btn-atk:active { box-shadow: 0 2px 0 #922b21, inset 0 1px 0 rgba(255,255,255,0.3); }
        .btn-run { background: linear-gradient(180deg, #7f8c8d 0%, #57606f 100%); box-shadow: 0 6px 0 #2f3542, inset 0 1px 0 rgba(255,255,255,0.3); }
        .btn-run:active { box-shadow: 0 2px 0 #2f3542, inset 0 1px 0 rgba(255,255,255,0.3); }
        .btn-gold { background: linear-gradient(180deg, #f1c40f 0%, #f39c12 100%); box-shadow: 0 6px 0 #d35400, inset 0 1px 0 rgba(255,255,255,0.4); color: #000; }
        .btn-gold:active { box-shadow: 0 2px 0 #d35400, inset 0 1px 0 rgba(255,255,255,0.4); }

        .color-picker { display: flex; justify-content: center; gap: 15px; margin: 20px 0; }
        .color-dot { 
            width: 40px; height: 40px; border-radius: 50%; cursor: pointer; 
            border: 3px solid transparent; transition: 0.2s; 
            box-shadow: 0 4px 10px rgba(0,0,0,0.5), inset 0 2px 5px rgba(255,255,255,0.3);
        }
        .color-dot:hover { transform: scale(1.1) translateY(-2px); }
        .color-dot.selected { border-color: white; transform: scale(1.2); }

        #game-hud { display: none; position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 5; pointer-events: none; }
        
        .hud-stats {
            position: absolute; top: 20px; left: 20px;
            background: rgba(0,0,0,0.6); backdrop-filter: blur(10px); padding: 15px 25px; border-radius: 15px;
            color: white; border: 1px solid rgba(255,255,255,0.2);
            box-shadow: 0 8px 20px rgba(0,0,0,0.5);
            animation: slideIn 0.5s ease-out;
        }
        .hp-bar-bg { width: 160px; height: 12px; background: rgba(0,0,0,0.5); border-radius: 6px; margin-top: 5px; overflow: hidden; border: 1px solid rgba(255,255,255,0.2); }
        .hp-bar-fill { height: 100%; background: linear-gradient(90deg, #c0392b, #e74c3c, #ff6b6b); transition: width 0.3s; box-shadow: 0 0 10px #e74c3c; }

        .controls { position: absolute; bottom: 25px; right: 25px; pointer-events: auto; width: auto; }
        .controls .btn { font-size: 18px !important; padding: 14px 22px !important; border-radius: 50px !important; box-shadow: 0 6px 0 #1e8449, 0 8px 25px rgba(0,0,0,0.5) !important; }
        .controls .btn:disabled { opacity: 0.4; }

        .popup-panel {
            position: absolute; bottom: 25px; left: 50%; transform: translateX(-50%) scale(0.9);
            background: rgba(15, 15, 25, 0.92); backdrop-filter: blur(15px); border-radius: 14px;
            padding: 14px 18px; text-align: center; color: white; display: none; pointer-events: auto;
            width: 92%; max-width: 440px; box-shadow: 0 -8px 35px rgba(0,0,0,0.7);
            border: 1px solid rgba(255,255,255,0.2); opacity: 0;
            transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275), opacity 0.3s;
        }
        .popup-panel.active { display: block; opacity: 1; transform: translateX(-50%) scale(1); }
        .popup-panel .btn { padding: 10px !important; font-size: 14px !important; }

        .toast {
            position: absolute; top: 20px; right: 20px;
            transform: translateX(120%) scale(0.9);
            background: rgba(15, 15, 25, 0.92); backdrop-filter: blur(10px); 
            padding: 10px 16px; border-radius: 12px;
            font-size: 13px; font-weight: 600; color: white; 
            border-left: 4px solid #f1c40f;
            opacity: 0; transition: transform 0.35s cubic-bezier(0.175, 0.885, 0.32, 1.275), opacity 0.25s; 
            pointer-events: none; text-align: left; 
            max-width: 240px; width: auto; z-index: 20;
            box-shadow: 0 6px 20px rgba(0,0,0,0.5);
            line-height: 1.4;
        }
        .toast.show { opacity: 1; transform: translateX(0) scale(1); }

        @keyframes popIn {
            0% { transform: scale(0.5); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }
        @keyframes slideIn {
            0% { transform: translateX(-150%); opacity: 0; }
            100% { transform: translateX(0); opacity: 1; }
        }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <!-- ⚙️ SporeNet API config — override ที่นี่ถ้า deploy จริง -->
    <script>
        // ตั้ง API_BASE เป็น URL ของ api-server (เช่น https://your-bot-domain.com)
        // ถ้าเว็บเกม host คนละ domain กับ api ต้องตั้งค่านี้
        // ถ้าว่าง → ใช้ relative path (เว็บเกม + api อยู่ domain เดียวกัน)
        window.GAME_CONFIG = {
            API_BASE: 'https://hub-owen-compile-andrew.trycloudflare.com'  // เช่น 'https://api.sporenet.example.com'
        };
    </script>
</head>
<body>

    <div id="canvas-container"></div>
    <div class="vignette"></div>

    <div class="ui-layer">
        <div id="screen-setup" class="card">
            <h1>MUSHROOM RUN</h1>
            <h2>Voxel Endless Adventure</h2>
            <input type="text" id="hero-name" placeholder="ตั้งชื่อเจ้าเห็ด..." value="เห็ดทะลวงฟัน">
            <div class="color-picker" id="color-picker">

    <div id="game-hud">

            </div>
            <div style="font-size: 13px; opacity: 0.8; margin-top: 4px;">HP: <span id="hp-text" style="color: #fff; font-weight: bold;">100/100</span></div>
            <div class="hp-bar-bg"><div id="hp-bar" class="hp-bar-fill"></div></div>

            </div>
            <div style="font-size: 18px; margin-top: 8px; color: #f1c40f; font-weight: bold; text-shadow: 0 2px 4px rgba(0,0,0,0.5);">🍄 <span id="display-spore">0</span> spore</div>
            <div style="font-size: 13px; margin-top: 4px; color: #e91e63; font-weight: bold; display: flex; gap: 12px;">
                <span>🧪 <span id="display-potion">0</span></span>

        <button id="btn-potion" style="position: absolute; bottom: 90px; left: 25px; pointer-events: auto; background: linear-gradient(180deg, #e91e63 0%, #c2185b 100%); color: white; border: none; border-radius: 50%; width: 56px; height: 56px; font-size: 24px; cursor: pointer; box-shadow: 0 4px 0 #880e4f, 0 6px 20px rgba(0,0,0,0.5); z-index: 6; transition: 0.1s;">🧪</button>

        <div id="toast-container" style="position: absolute; top: 20px; right: 20px; z-index: 20; pointer-events: none; display: flex; flex-direction: column; gap: 8px; max-width: 240px;"></div>
        <div id="toast-msg" class="toast"></div>

        <div id="battle-panel" class="popup-panel" style="border-top: 4px solid #e74c3c;">

                <div style="flex: 1; text-align: left;">
                    <h3 id="battle-title" style="color: #ff7979; margin: 0 0 4px 0; font-size: 16px;">👾 มอนสเตอร์ขวางทาง!</h3>
                    <p id="battle-desc" style="font-size: 11px; margin: 0 0 6px 0; opacity: 0.75; font-style: italic; line-height: 1.3;">...</p>
                    <p style="font-size: 13px; margin: 0; opacity: 0.9;">❤️ Enemy HP: <span id="enemy-hp" style="font-size: 16px; font-weight: bold; color: #fff;">50</span></p>
                </div>
                <div style="display: flex; flex-direction: column; gap: 6px; min-width: 90px;">

                    <button class="btn btn-run" style="margin:0;" id="btn-runaway">💨 หนี</button>
                </div>
            </div>
        </div>

        <div id="item-panel" class="popup-panel" style="border-top: 4px solid #f1c40f;">
            <div style="display: flex; align-items: center; gap: 14px;">
                <div style="flex: 1; text-align: left;">
                    <h3 id="item-title" style="color: #f1c40f; margin: 0 0 4px 0; font-size: 16px;">✨ พบสมบัติ!</h3>

                </div>
                <div style="display: flex; flex-direction: column; gap: 6px; min-width: 90px;">

        <div class="controls">

    <script>
        // ================= GLOBAL VARIABLES =================
        let scene, camera, renderer;
        let playerGroup, capMaterial, playerLegs = [], playerArms = [], playerStaff;
        let selectedColor = 0xe74c3c;
        
        let chunks = [];
        let particleSystems = []; 
        const CHUNK_LEN = 12; 
        let isWalking = false, inInteraction = false;
        let cameraShake = 0; 
        let isBattling = false; // กำลังอยู่ใน animation การโจมตี — กันกดซ้อน

        let player = { 
            name: "Player", 
            // Level เดียว (ตามบอท — ไม่แยก farmLevel/battleLevel)
            level: 1,
            farmExp: 0, // EXP สะสม
            // Battle stats (คำนวณจาก level)
            hp: 100, maxHp: 100, atk: 25,
            // สกุลเงิน: spore (เห็ด) ไม่ใช่ทองคำ
            spore: 0,
            // Inventory
            potionCount: 0,        // จำนวนน้ำยาฟื้นฟู HP
            items: [],             // ไอเทมบัฟที่สะสม (id list)
            // Buffs สะสม (คำนวณจาก items ที่สวมใส่)
            sporeBonusPercent: 0,
            sporeBonusFlat: 0,
            expBonusPercent: 0,
            attackBonusPercent: 0
        };
        let currentEnemy = { hp: 0, atk: 0, mesh: null, originalColor: 0x9b59b6, type: null };
        let currentChunkEvent = null;

        // สูตรคำนวณ EXP ที่ต้องการต่อเลเวล (เหมือนบอท: level * 100)
        function expNeededForLevel(lv) { return lv * 100; }

        // สูตรคำนวณ battle stats จาก level
        function maxHpForLevel(lv) { return 100 + (lv - 1) * 15; }
        function atkForLevel(lv) { return 25 + (lv - 1) * 3; }

        // อัปเดต battle stats ตาม level
        function recalcStatsFromLevel() {
            const newMaxHp = maxHpForLevel(player.level);
            const newAtk = atkForLevel(player.level);
            // ปรับ maxHp และ atk ตาม level
            player.maxHp = newMaxHp;
            player.atk = newAtk;
            // ถ้า hp เกิน maxHp ให้ clamp
            if(player.hp > player.maxHp) player.hp = player.maxHp;
        }

        // ================= MUSHROOM & MONSTER CONFIG =================

        // 📦 BOX TYPES — กล่องสมบัติ 3 ระดับ

        // 🧪 POTION — น้ำยาฟื้นฟู HP
        const POTION = {

        // สุ่มไอเทมดรอป — 0.75% เท่ากันทุกกล่อง (ตามบอท)
        function rollItemDrop() {
            if (Math.random() * 100 >= 0.75) return null;
            return ITEMS_POOL[Math.floor(Math.random() * ITEMS_POOL.length)];
        }

        // สวมใส่ไอเทม → สะสม buff ถาวร
        function equipItem(item) {
            switch(item.buffType) {
                case 'attack_percent': player.attackBonusPercent += item.buffValue; break;
                case 'spore_percent':  player.sporeBonusPercent  += item.buffValue; break;
                case 'spore_flat':     player.sporeBonusFlat     += item.buffValue; break;
                case 'exp_percent':    player.expBonusPercent    += item.buffValue; break;
            }
            player.items.push(item.id);
        }

        // 🌱 คำนวณสปอร์ที่ได้จากการเก็บเห็ด (base + level bonus +2/lv + item buffs)
        function calculateSporeGain(baseAmount) {
            const levelBonus = (player.level - 1) * 2;
            const percentMult = 1 + player.sporeBonusPercent / 100;
            return Math.floor((baseAmount + levelBonus + player.sporeBonusFlat) * percentMult);
        }

        // ⭐ EXP_PER_FARM = 5 (เก็บเห็ด), EXP_MONSTER_WIN = 10 (ชนะมอนสเตอร์)
        const EXP_PER_FARM = 5;
        const EXP_MONSTER_WIN = 10;
        function addExp(amount) {
            // ปรับ EXP ตาม exp_bonus_percent จากไอเทม
            const finalExp = Math.floor(amount * (1 + player.expBonusPercent / 100));
            player.farmExp += finalExp;
            let leveledUp = false;
            while(player.farmExp >= expNeededForLevel(player.level)) {
                player.farmExp -= expNeededForLevel(player.level);
                player.level += 1;
                leveledUp = true;
            }
            if(leveledUp) recalcStatsFromLevel();
            return leveledUp;
        }

        // 🧪 ใช้น้ำยาฟื้นฟู HP
        function usePotion() {
            if(player.potionCount <= 0) {
                showToast(`🧪 ไม่มีน้ำยาฟื้นฟู!`);
                return;
            }
            if(player.hp >= player.maxHp) {
                showToast(`❤️ HP เต็มแล้ว ไม่ต้องฟื้น!`);
                return;
            }
            player.potionCount--;
            const healAmount = Math.floor(player.maxHp * POTION.healPercent);
            const actualHeal = Math.min(healAmount, player.maxHp - player.hp);
            player.hp += actualHeal;
            showToast(`🧪 ใช้น้ำยาฟื้นฟู +${actualHeal} HP (เหลือ ${player.potionCount} ขวด)`);
            updateHUD();
            syncPlayerData(null, { usePotion: true });
            // particle สีเขียวรอบตัว
            createParticleBurst(new THREE.Vector3(playerGroup.position.x, 1, playerGroup.position.z), 0x2ecc71, 20);
        }

        // helpers: weighted random pick
        function pickFromPool(pool) {
            const keys = Object.keys(pool);
            const total = keys.reduce((s,k) => s + pool[k].weight, 0);
            let r = Math.random() * total;
            for (const k of keys) {
                r -= pool[k].weight;
                if (r <= 0) return pool[k];
            }
            return pool[keys[0]];
        }

        // ================= INITIALIZATION =================
        function init3D() {
            const container = document.getElementById('canvas-container');
            scene = new THREE.Scene();
            
            // 🌌 Gradient Skybox
            const skyGeo = new THREE.SphereGeometry(100, 32, 16);
            const skyMat = new THREE.ShaderMaterial({
                uniforms: {
                    topColor: { value: new THREE.Color(0x1e3c72) },
                    bottomColor: { value: new THREE.Color(0x7fb3d5) },
                    offset: { value: 33 },
                    exponent: { value: 0.6 }
                },
                vertexShader: `varying vec3 vWorldPosition; void main() { vec4 worldPosition = modelMatrix * vec4(position, 1.0); vWorldPosition = worldPosition.xyz; gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }`,
                fragmentShader: `uniform vec3 topColor; uniform vec3 bottomColor; uniform float offset; uniform float exponent; varying vec3 vWorldPosition; void main() { float h = normalize(vWorldPosition + offset).y; gl_FragColor = vec4(mix(bottomColor, topColor, max(pow(max(h, 0.0), exponent), 0.0)), 1.0); }`,
                side: THREE.BackSide
            });
            scene.add(new THREE.Mesh(skyGeo, skyMat));

            scene.fog = new THREE.Fog(0x7fb3d5, 25, 70);

            camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.1, 200);
            camera.position.set(6.5, 9.0, 13.5); 
            camera.lookAt(0, 1.5, 0); 
            
            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.shadowMap.enabled = true;
            renderer.shadowMap.type = THREE.PCFSoftShadowMap;
            renderer.outputEncoding = THREE.sRGBEncoding;
            renderer.toneMapping = THREE.ACESFilmicToneMapping;
            renderer.toneMappingExposure = 1.2;
            container.appendChild(renderer.domElement);

            const hemiLight = new THREE.HemisphereLight(0xddeeff, 0x223344, 0.6);

            dirLight.shadow.mapSize.width = 2048;
            dirLight.shadow.mapSize.height = 2048;
            dirLight.shadow.camera.left = -20; dirLight.shadow.camera.right = 20;

            createDistantMountains();

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);

        // ================= WORLD BUILDING =================
        function createDistantMountains() {
            const mat = new THREE.MeshStandardMaterial({ color: 0x4a5c7a, flatShading: true, roughness: 1 });
            const mountainGroup = new THREE.Group();
            for(let i=0; i<10; i++) {
                const h = 15 + Math.random() * 20;
                const m = new THREE.Mesh(new THREE.ConeGeometry(10 + Math.random()*5, h, 4), mat);
                m.position.set((Math.random()-0.5) * 100, h/2 - 5, -40 - Math.random()*30);
                m.rotation.y = Math.random() * Math.PI;
                mountainGroup.add(m);
            }
            scene.add(mountainGroup);
        }

        function createClouds() {
            const cloudMat = new THREE.MeshStandardMaterial({ color: 0xffffff, transparent: true, opacity: 0.8, roughness: 1, flatShading: true });
            for(let i=0; i<15; i++) {
                const cloud = new THREE.Group();
                for(let j=0; j<3+Math.random()*3; j++) {
                    const b = new THREE.Mesh(new THREE.IcosahedronGeometry(2 + Math.random()*1.5, 0), cloudMat);
                    b.position.set(j*2.5 - 3, Math.random()*0.5, Math.random()*0.5);
                    b.scale.y = 0.6;
                    cloud.add(b);
                }
                cloud.position.set((Math.random()-0.5)*80, 20 + Math.random()*10, -20 - Math.random()*40);
                scene.add(cloud);
            }
        }

        function createAmbientParticles() {
            const geometry = new THREE.BufferGeometry();
            const vertices = [];
            for ( let i = 0; i < 200; i++ ) {
                vertices.push( Math.random() * 40 - 20, Math.random() * 15, Math.random() * 40 - 20 );
            }
            geometry.setAttribute( 'position', new THREE.Float32BufferAttribute( vertices, 3 ) );
            const material = new THREE.PointsMaterial( { color: 0xfff5b6, size: 0.15, transparent: true, opacity: 0.6 } );
            const points = new THREE.Points( geometry, material );
            scene.add( points );
        }

        // ================= CHUNK & ENVIRONMENT =================
        function createChunk(zPos, isEmptyStartingChunk) {
            const chunk = new THREE.Group();
            chunk.position.z = zPos;

            const groundMat1 = new THREE.MeshStandardMaterial({ color: 0x4caf50, roughness: 1, flatShading: true });
            const ground = new THREE.Mesh(new THREE.PlaneGeometry(30, CHUNK_LEN), groundMat1);
            ground.rotation.x = -Math.PI / 2; ground.receiveShadow = true;
            
            const roadMat = new THREE.MeshStandardMaterial({ color: 0xd4a373, roughness: 0.9, flatShading: true });
            const road = new THREE.Mesh(new THREE.PlaneGeometry(4.5, CHUNK_LEN), roadMat);
            road.rotation.x = -Math.PI / 2; road.position.y = 0.05; road.receiveShadow = true;
            
            chunk.add(ground, road);

            if(Math.random() > 0.2) createProTree(chunk, -4.5, (Math.random()-0.5)*CHUNK_LEN);
            if(Math.random() > 0.2) createProTree(chunk, 4.5, (Math.random()-0.5)*CHUNK_LEN);
            if(Math.random() > 0.5) createSmallDecor(chunk, -3.5, (Math.random()-0.5)*CHUNK_LEN);
            if(Math.random() > 0.5) createSmallDecor(chunk, 3.5, (Math.random()-0.5)*CHUNK_LEN);

            if (!isEmptyStartingChunk) {
                const hugeBush = createBeautifulHugeBush();
                hugeBush.position.set(0, 0, 1.5); 
                chunk.add(hugeBush);

                // 25% มอนสเตอร์, 60% เห็ด, 15% กล่องสมบัติ
                const roll = Math.random();
                let entity, type, typeKey;
                if (roll < 0.25) {
                    // มอนสเตอร์
                    const mt = pickFromPool(MONSTER_TYPES);
                    typeKey = mt.key;
                    type = 'monster';
                    entity = createVoxelMonster(typeKey);
                } else if (roll < 0.85) {
                    // เห็ด (60%)
                    const mt = pickFromPool(MUSHROOM_TYPES);
                    typeKey = mt.key;
                    type = 'mushroom';
                    entity = createVoxelMushroom(typeKey);
                } else {
                    // กล่องสมบัติ (15%)
                    const bt = pickFromPool(BOX_TYPES);
                    typeKey = bt.key;
                    type = 'box';
                    entity = createVoxelBox(typeKey);
                }
                entity.position.set(0, entity.userData.yOffset, -2.5); 
                chunk.add(entity);

                chunk.userData = { 
                    bush: hugeBush, 
                    entity: entity, 
                    type: type,
                    typeKey: typeKey,
                    active: true 
                };
            } else {
                chunk.userData = { active: false };
            }

            scene.add(chunk);
            return chunk;
        }

        function disposeChunk(chunk) {
            chunk.traverse(child => {
                if (child.isMesh) {
                    child.geometry.dispose();
                    if(Array.isArray(child.material)) child.material.forEach(m => m.dispose());
                    else child.material.dispose();
                }
            });
            scene.remove(chunk);
        }

        function createBeautifulHugeBush() {
            const group = new THREE.Group();
            const mat1 = new THREE.MeshStandardMaterial({ color: 0x1e8449, roughness: 0.8, flatShading: true });
            const mat2 = new THREE.MeshStandardMaterial({ color: 0x27ae60, roughness: 0.8, flatShading: true });

            for(let i = 0; i < 8; i++) {
                const size = 1.5 + Math.random() * 2;
                // เปลี่ยนเป็น Icosahedron (ทรงกลมเหลี่ยม) ให้ดูมนขึ้น
                const leafBlock = new THREE.Mesh(new THREE.IcosahedronGeometry(size, 0), Math.random() > 0.5 ? mat1 : mat2);
                leafBlock.position.set((Math.random() - 0.5) * 3, 1 + Math.random() * 2, (Math.random() - 0.5) * 2.5);
                leafBlock.rotation.set(Math.random() * Math.PI, Math.random() * Math.PI, 0);
                leafBlock.castShadow = true; leafBlock.receiveShadow = true;
                group.add(leafBlock);
            }
            return group;
        }

        function createProTree(parent, x, z) {
            const trunkMat = new THREE.MeshStandardMaterial({ color: 0x5d4037, flatShading: true });
            const leavesMat1 = new THREE.MeshStandardMaterial({ color: 0x2ecc71, flatShading: true });
            const leavesMat2 = new THREE.MeshStandardMaterial({ color: 0x27ae60, flatShading: true });

            // ลำต้นทรงกระบอก
            const trunk = new THREE.Mesh(new THREE.CylinderGeometry(0.3, 0.4, 2.5, 6), trunkMat);
            trunk.position.set(x, 1.25, z); trunk.castShadow = true; trunk.receiveShadow = true;
            
            const leaves = new THREE.Group();
            // ใบไม้ทรงกลมเหลี่ยมซ้อนกัน
            const l1 = new THREE.Mesh(new THREE.IcosahedronGeometry(1.5, 0), leavesMat1);
            l1.position.set(x, 3, z); l1.castShadow = true;
            const l2 = new THREE.Mesh(new THREE.IcosahedronGeometry(1.2, 0), leavesMat2);
            l2.position.set(x + 0.8, 2.5, z); l2.castShadow = true;
            const l3 = new THREE.Mesh(new THREE.IcosahedronGeometry(1.2, 0), leavesMat2);
            l3.position.set(x - 0.8, 2.5, z); l3.castShadow = true;
            const l4 = new THREE.Mesh(new THREE.IcosahedronGeometry(1, 0), leavesMat1);
            l4.position.set(x, 4, z); l4.castShadow = true;
            
            leaves.add(l1, l2, l3, l4);
            parent.add(trunk, leaves);
        }

        function createSmallDecor(parent, x, z) {
            const isFlower = Math.random() > 0.4;
            if(isFlower) {
                const stem = new THREE.Mesh(new THREE.CylinderGeometry(0.05, 0.05, 0.5, 4), new THREE.MeshStandardMaterial({ color: 0x27ae60, flatShading: true }));
                stem.position.set(x, 0.25, z);
                
                const colors = [0xe74c3c, 0xf1c40f, 0xffffff, 0xe67e22, 0xff7979];
                const head = new THREE.Group();
                const center = new THREE.Mesh(new THREE.SphereGeometry(0.15, 6, 4), new THREE.MeshStandardMaterial({ color: 0xf1c40f, flatShading: true }));
                head.add(center);
                for(let i=0; i<5; i++) {
                    const angle = (i/5) * Math.PI * 2;
                    const petal = new THREE.Mesh(new THREE.SphereGeometry(0.12, 6, 4), new THREE.MeshStandardMaterial({ color: colors[Math.floor(Math.random()*colors.length)], flatShading: true }));
                    petal.position.set(Math.cos(angle)*0.2, 0, Math.sin(angle)*0.2);
                    head.add(petal);
                }
                head.position.set(x, 0.6, z);
                head.castShadow = true;
                parent.add(stem, head);
            } else {
                const rock = new THREE.Mesh(new THREE.DodecahedronGeometry(0.3, 0), new THREE.MeshStandardMaterial({ color: 0x95a5a6, flatShading: true }));
                rock.position.set(x, 0.15, z); rock.rotation.y = Math.random() * Math.PI;
                rock.scale.set(1, 0.6, 1);
                rock.castShadow = true; rock.receiveShadow = true;
                parent.add(rock);
            }
        }

        // ================= ENTITIES (โมเดลอัปเกรด) =================

        // ─── มอนสเตอร์ 4 ชนิดจาก sporenet-bot /farm ───────────────
        function createVoxelMonster(typeKey) {
            const t = MONSTER_TYPES[typeKey] || MONSTER_TYPES.caterpillar;
            let mesh;
            switch(typeKey) {
                case 'caterpillar': mesh = createMonsterCaterpillar(t); break;
                case 'bat':         mesh = createMonsterBat(t); break;
                case 'boar':        mesh = createMonsterBoar(t); break;
                case 'dragon':      mesh = createMonsterDragon(t); break;
                default:            mesh = createMonsterCaterpillar(t);
            }
            mesh.userData = { 
                yOffset: t.yOffset, 
                isAnimating: true, 
                kind: 'monster', 
                typeKey: typeKey,
                baseColor: t.color
            };
            return mesh;
        }

        // 🐛 หนอนเขียวป่า — ลำตัวเป็นปมเรียงกัน สีเขียวสด มีจุดเหลือง
        function createMonsterCaterpillar(t) {
            const g = new THREE.Group();
            const bodyMat = new THREE.MeshStandardMaterial({ color: t.color, roughness: 0.7, flatShading: true });
            const spotMat = new THREE.MeshStandardMaterial({ color: 0xffeb3b, roughness: 0.6, flatShading: true });
            const faceMat = new THREE.MeshStandardMaterial({ color: 0x2e7d32, roughness: 0.7, flatShading: true });

            // ปมลำตัว 5 ข้อ
            const segCount = 5;
            const segs = [];
            for(let i = 0; i < segCount; i++) {
                const r = 0.55 - i * 0.05;
                const seg = new THREE.Mesh(new THREE.IcosahedronGeometry(r, 0), bodyMat);
                seg.position.set(-(segCount-1)*0.35 + i*0.7, 0, 0);
                seg.castShadow = true;
                g.add(seg);
                segs.push(seg);
                // จุดบนหลัง
                if(i < segCount - 1) {
                    const spot = new THREE.Mesh(new THREE.IcosahedronGeometry(0.12, 0), spotMat);
                    spot.position.set(seg.position.x, r * 0.85, 0);
                    g.add(spot);
                }
            }
            g.userData.segments = segs;

            // หัว (ปมสุดท้ายด้านขวา)
            const head = new THREE.Mesh(new THREE.IcosahedronGeometry(0.5, 0), faceMat);
            head.position.set((segCount-1)*0.35 + 0.65, 0, 0);
            head.castShadow = true;
            g.add(head);
            g.userData.head = head;

            // ตาแดงโลหิต
            const eyeMat = new THREE.MeshStandardMaterial({ color: 0xff0000, emissive: 0xff0000, emissiveIntensity: 0.8, flatShading: true });
            const e1 = new THREE.Mesh(new THREE.IcosahedronGeometry(0.1, 0), eyeMat);
            e1.position.set(head.position.x + 0.05, 0.15, -0.3);
            const e2 = new THREE.Mesh(new THREE.IcosahedronGeometry(0.1, 0), eyeMat);
            e2.position.set(head.position.x + 0.05, 0.15, 0.3);
            g.add(e1, e2);

            // หนวด
            const antMat = new THREE.MeshStandardMaterial({ color: 0x1b5e20, flatShading: true });
            const a1 = new THREE.Mesh(new THREE.CylinderGeometry(0.03, 0.05, 0.4, 4), antMat);
            a1.position.set(head.position.x + 0.4, 0.3, -0.15); a1.rotation.z = -0.5;
            const a2 = new THREE.Mesh(new THREE.CylinderGeometry(0.03, 0.05, 0.4, 4), antMat);
            a2.position.set(head.position.x + 0.4, 0.3, 0.15); a2.rotation.z = -0.5;
            g.add(a1, a2);

            return g;
        }

        // 🦇 ค้างคาวเห็ดพิษ — ลำตัวเล็ก ปีกกว้าง มีหมวกเห็ดพิษสีม่วงบนหัว
        function createMonsterBat(t) {
            const g = new THREE.Group();
            const bodyMat = new THREE.MeshStandardMaterial({ color: 0x4a148c, roughness: 0.8, flatShading: true });
            const wingMat = new THREE.MeshStandardMaterial({ color: t.color, roughness: 0.6, flatShading: true, side: THREE.DoubleSide });
            const capMat  = new THREE.MeshStandardMaterial({ color: 0x6a1b9a, roughness: 0.5, flatShading: true, emissive: 0x4a148c, emissiveIntensity: 0.4 });

            // ลำตัวกลมเหลี่ยม
            const body = new THREE.Mesh(new THREE.IcosahedronGeometry(0.5, 0), bodyMat);
            body.scale.set(1, 1.3, 1); body.castShadow = true;
            g.add(body); g.userData.body = body;

            // หัว
            const head = new THREE.Mesh(new THREE.IcosahedronGeometry(0.4, 0), bodyMat);
            head.position.set(0, 0.3, -0.3); head.castShadow = true;
            g.add(head); g.userData.head = head;

            // หู/คาว
            const ear1 = new THREE.Mesh(new THREE.ConeGeometry(0.15, 0.3, 4), bodyMat);
            ear1.position.set(-0.2, 0.65, -0.3);
            const ear2 = new THREE.Mesh(new THREE.ConeGeometry(0.15, 0.3, 4), bodyMat);
            ear2.position.set(0.2, 0.65, -0.3);
            g.add(ear1, ear2);

            // หมวกเห็ดพิษสีม่วงบนหัว (เอกลักษณ์ของค้างคาวเห็ดพิษ)
            const cap = new THREE.Mesh(new THREE.IcosahedronGeometry(0.45, 0), capMat);
            cap.scale.set(1.2, 0.6, 1.2); cap.position.set(0, 0.7, -0.3); cap.castShadow = true;
            g.add(cap); g.userData.cap = cap;
            // จุดขาวบนหมวกเห็ด
            const spotMat = new THREE.MeshStandardMaterial({ color: 0xffffff, flatShading: true });
            for(let i = 0; i < 5; i++) {
                const angle = (i / 5) * Math.PI * 2;
                const spot = new THREE.Mesh(new THREE.IcosahedronGeometry(0.08, 0), spotMat);
                spot.position.set(Math.cos(angle) * 0.4, 0.85, -0.3 + Math.sin(angle) * 0.4);
                g.add(spot);
            }

            // ปีก 2 ข้าง — ทรงสามเหลี่ยมแบน
            const wingGeo = new THREE.ConeGeometry(0.9, 1.4, 4);
            const wingL = new THREE.Mesh(wingGeo, wingMat);
            wingL.position.set(-0.85, 0.1, -0.1); wingL.rotation.z = Math.PI / 2; wingL.rotation.y = -0.3; wingL.scale.set(1, 1, 0.15);
            const wingR = new THREE.Mesh(wingGeo, wingMat);
            wingR.position.set(0.85, 0.1, -0.1); wingR.rotation.z = -Math.PI / 2; wingR.rotation.y = 0.3; wingR.scale.set(1, 1, 0.15);
            g.add(wingL, wingR);
            g.userData.wingL = wingL; g.userData.wingR = wingR;

            // ตาแดงเรืองแสง
            const eyeMat = new THREE.MeshStandardMaterial({ color: 0xff1744, emissive: 0xff1744, emissiveIntensity: 1.2, flatShading: true });
            const e1 = new THREE.Mesh(new THREE.IcosahedronGeometry(0.09, 0), eyeMat);
            e1.position.set(-0.15, 0.35, -0.6);
            const e2 = new THREE.Mesh(new THREE.IcosahedronGeometry(0.09, 0), eyeMat);
            e2.position.set(0.15, 0.35, -0.6);
            g.add(e1, e2);

            // เขี้ยว
            const fangMat = new THREE.MeshStandardMaterial({ color: 0xffffff, flatShading: true });
            const f1 = new THREE.Mesh(new THREE.ConeGeometry(0.04, 0.18, 4), fangMat);
            f1.position.set(-0.1, 0.15, -0.55); f1.rotation.x = Math.PI;
            const f2 = new THREE.Mesh(new THREE.ConeGeometry(0.04, 0.18, 4), fangMat);
            f2.position.set(0.1, 0.15, -0.55); f2.rotation.x = Math.PI;
            g.add(f1, f2);

            return g;
        }

        // 🐗 หมูป่าบ้าเลือด — ลำตัวอ้วน ขนแข็งบนหลัง งาสีขาวคู่
        function createMonsterBoar(t) {
            const g = new THREE.Group();
            const bodyMat = new THREE.MeshStandardMaterial({ color: 0x6d4c41, roughness: 0.9, flatShading: true });
            const maneMat = new THREE.MeshStandardMaterial({ color: 0x3e2723, roughness: 1, flatShading: true });
            const faceMat = new THREE.MeshStandardMaterial({ color: 0x4e342e, roughness: 0.9, flatShading: true });
            const tuskMat = new THREE.MeshStandardMaterial({ color: 0xfff8e1, roughness: 0.3, flatShading: true });
            const eyeMat  = new THREE.MeshStandardMaterial({ color: 0xff0000, emissive: 0xff0000, emissiveIntensity: 0.9, flatShading: true });

            // ลำตัวอ้วนยาว
            const body = new THREE.Mesh(new THREE.IcosahedronGeometry(0.85, 1), bodyMat);
            body.scale.set(1.4, 1, 1); body.castShadow = true;
            g.add(body); g.userData.body = body;

            // ขนแข็งบนหลัง (หลายๆ หนามเล็ก)
            for(let i = 0; i < 6; i++) {
                const spine = new THREE.Mesh(new THREE.ConeGeometry(0.1, 0.4, 4), maneMat);
                spine.position.set(-0.6 + i * 0.25, 0.7, 0);
                spine.rotation.z = -0.2;
                g.add(spine);
            }

            // หัว
            const head = new THREE.Mesh(new THREE.IcosahedronGeometry(0.55, 0), faceMat);
            head.position.set(1.0, -0.05, 0); head.castShadow = true;
            g.add(head); g.userData.head = head;

            // จมูก (snout)
            const snout = new THREE.Mesh(new THREE.BoxGeometry(0.3, 0.25, 0.35), faceMat);
            snout.position.set(1.45, -0.15, 0); snout.castShadow = true;
            g.add(snout);

            // งาคู่
            const tusk1 = new THREE.Mesh(new THREE.ConeGeometry(0.06, 0.3, 4), tuskMat);
            tusk1.position.set(1.35, -0.3, -0.15); tusk1.rotation.x = Math.PI; tusk1.rotation.z = 0.3;
            const tusk2 = new THREE.Mesh(new THREE.ConeGeometry(0.06, 0.3, 4), tuskMat);
            tusk2.position.set(1.35, -0.3, 0.15); tusk2.rotation.x = Math.PI; tusk2.rotation.z = -0.3;
            g.add(tusk1, tusk2);

            // ตาแดงฉาน
            const e1 = new THREE.Mesh(new THREE.IcosahedronGeometry(0.1, 0), eyeMat);
            e1.position.set(1.05, 0.2, -0.3);
            const e2 = new THREE.Mesh(new THREE.IcosahedronGeometry(0.1, 0), eyeMat);
            e2.position.set(1.05, 0.2, 0.3);
            g.add(e1, e2);

            // ขา 4 ข้างเตี้ย
            const legMat = new THREE.MeshStandardMaterial({ color: 0x3e2723, flatShading: true });
            const legPositions = [[-0.5,-0.45,-0.4],[0.5,-0.45,-0.4],[-0.5,-0.45,0.4],[0.5,-0.45,0.4]];
            legPositions.forEach(p => {
                const leg = new THREE.Mesh(new THREE.BoxGeometry(0.2, 0.4, 0.2), legMat);
                leg.position.set(...p); leg.castShadow = true;
                g.add(leg);
            });

            return g;
        }

        // 🐉 มังกรเห็ดโบราณ — ลำตัวยาว มีหนามเห็ดบนหลัง ปีกคู่ใหญ่ หางยาว
        function createMonsterDragon(t) {
            const g = new THREE.Group();
            const scaleMat = new THREE.MeshStandardMaterial({ color: t.color, roughness: 0.4, metalness: 0.3, flatShading: true });
            const bellyMat = new THREE.MeshStandardMaterial({ color: 0xffeb3b, roughness: 0.6, flatShading: true });
            const wingMat  = new THREE.MeshStandardMaterial({ color: 0xb71c1c, roughness: 0.5, flatShading: true, side: THREE.DoubleSide });
            const mushMat  = new THREE.MeshStandardMaterial({ color: 0xd84315, roughness: 0.5, flatShading: true, emissive: 0xff6f00, emissiveIntensity: 0.5 });
            const eyeMat   = new THREE.MeshStandardMaterial({ color: 0xffd700, emissive: 0xffd700, emissiveIntensity: 1.5, flatShading: true });

            // ลำตัวยาวเป็นปม
            const body = new THREE.Mesh(new THREE.IcosahedronGeometry(0.7, 1), scaleMat);
            body.scale.set(1.6, 0.9, 0.9); body.castShadow = true;
            g.add(body); g.userData.body = body;

            // คอยาวเรียว
            const neck = new THREE.Mesh(new THREE.CylinderGeometry(0.25, 0.4, 0.8, 6), scaleMat);
            neck.position.set(0.9, 0.4, 0); neck.rotation.z = -0.6; neck.castShadow = true;
            g.add(neck);

            // หัวมังกร
            const head = new THREE.Mesh(new THREE.IcosahedronGeometry(0.5, 0), scaleMat);
            head.position.set(1.4, 0.7, 0); head.castShadow = true;
            g.add(head); g.userData.head = head;

            // จมูกยาว
            const snout = new THREE.Mesh(new THREE.ConeGeometry(0.2, 0.5, 4), scaleMat);
            snout.position.set(1.85, 0.6, 0); snout.rotation.z = -Math.PI / 2;
            g.add(snout);

            // หนามเห็ด (mushroom spikes) บนหลัง — เอกลักษณ์ของมังกรเห็ด
            for(let i = 0; i < 5; i++) {
                const cap = new THREE.Mesh(new THREE.IcosahedronGeometry(0.25, 0), mushMat);
                cap.scale.set(1, 0.6, 1); cap.position.set(-0.5 + i * 0.3, 0.65, 0); cap.castShadow = true;
                g.add(cap);
                const stem = new THREE.Mesh(new THREE.CylinderGeometry(0.06, 0.08, 0.2, 6), 
                    new THREE.MeshStandardMaterial({ color: 0xffeccc, flatShading: true }));
                stem.position.set(-0.5 + i * 0.3, 0.5, 0);
                g.add(stem);
            }

            // ปีกคู่ใหญ่
            const wingGeo = new THREE.ConeGeometry(1.0, 1.6, 4);
            const wingL = new THREE.Mesh(wingGeo, wingMat);
            wingL.position.set(-0.2, 0.7, -0.7); wingL.rotation.z = Math.PI / 3; wingL.rotation.y = -0.4; wingL.scale.set(1, 1, 0.12);
            const wingR = new THREE.Mesh(wingGeo, wingMat);
            wingR.position.set(-0.2, 0.7, 0.7); wingR.rotation.z = Math.PI / 3; wingR.rotation.y = 0.4; wingR.scale.set(1, 1, 0.12);
            g.add(wingL, wingR);
            g.userData.wingL = wingL; g.userData.wingR = wingR;

            // หางยาว
            const tail = new THREE.Mesh(new THREE.CylinderGeometry(0.1, 0.3, 1.0, 6), scaleMat);
            tail.position.set(-1.2, -0.1, 0); tail.rotation.z = Math.PI / 2.5; tail.castShadow = true;
            g.add(tail);
            // ปลายหางเป็นเห็ดเล็ก
            const tailCap = new THREE.Mesh(new THREE.IcosahedronGeometry(0.2, 0), mushMat);
            tailCap.scale.set(1, 0.6, 1); tailCap.position.set(-1.7, -0.3, 0);
            g.add(tailCap);

            // ตาทองเรืองแสง
            const e1 = new THREE.Mesh(new THREE.IcosahedronGeometry(0.1, 0), eyeMat);
            e1.position.set(1.45, 0.85, -0.3);
            const e2 = new THREE.Mesh(new THREE.IcosahedronGeometry(0.1, 0), eyeMat);
            e2.position.set(1.45, 0.85, 0.3);
            g.add(e1, e2);

            // เขาคู่
            const hornMat = new THREE.MeshStandardMaterial({ color: 0xffd700, metalness: 0.7, roughness: 0.3, flatShading: true });
            const h1 = new THREE.Mesh(new THREE.ConeGeometry(0.1, 0.4, 4), hornMat);
            h1.position.set(1.3, 1.1, -0.2); h1.rotation.z = -0.3;
            const h2 = new THREE.Mesh(new THREE.ConeGeometry(0.1, 0.4, 4), hornMat);
            h2.position.set(1.3, 1.1, 0.2); h2.rotation.z = -0.3;
            g.add(h1, h2);

            // PointLight ทองอร่ามรอบตัวมังกร
            const dragonLight = new THREE.PointLight(0xff6f00, 2, 8);
            dragonLight.position.set(0, 0.5, 0);
            g.add(dragonLight);

            return g;
        }

        // ─── เห็ด 3 ชนิดจาก sporenet-bot /farm ───────────────────
        // ─── กล่องสมบัติ 3 ระดับ ───────────────────────────────
        function createVoxelBox(typeKey) {
            const t = BOX_TYPES[typeKey] || BOX_TYPES.common;
            let mesh;
            switch(typeKey) {
                case 'common': mesh = createBoxCommon(t); break;
                case 'iron':   mesh = createBoxIron(t); break;
                case 'gold':   mesh = createBoxGold(t); break;
                default:       mesh = createBoxCommon(t);
            }
            mesh.userData = { 
                yOffset: t.yOffset, 
                isAnimating: true, 
                kind: 'box', 
                typeKey: typeKey,
                baseColor: t.color,
                glowColor: t.glowColor
            };
            return mesh;
        }

        // 📦 กล่องธรรมดา — ไม้สีน้ำตาล มีโลหะติดมุม
        function createBoxCommon(t) {
            const g = new THREE.Group();
            const woodMat = new THREE.MeshStandardMaterial({ color: t.color, roughness: 0.9, flatShading: true });
            const bandMat = new THREE.MeshStandardMaterial({ color: 0x5d4037, roughness: 0.7, flatShading: true });
            // กล่องไม้หลัก
            const body = new THREE.Mesh(new THREE.BoxGeometry(1.1, 0.8, 1.1), woodMat);
            body.position.y = 0.4; body.castShadow = true; body.receiveShadow = true;
            g.add(body);
            // ฝากล่อง (เอียงเล็กน้อย)
            const lid = new THREE.Mesh(new THREE.BoxGeometry(1.15, 0.2, 1.15), woodMat);
            lid.position.y = 0.9; lid.rotation.z = 0.05; lid.castShadow = true;
            g.add(lid); g.userData.lid = lid;
            // แถบเหล็กดำรอบกล่อง
            const band1 = new THREE.Mesh(new THREE.BoxGeometry(1.15, 0.1, 1.15), bandMat);
            band1.position.y = 0.2;
            const band2 = new THREE.Mesh(new THREE.BoxGeometry(1.15, 0.1, 1.15), bandMat);
            band2.position.y = 0.65;
            g.add(band1, band2);
            // กุญแจเล็กๆ ที่ฝา
            const lockMat = new THREE.MeshStandardMaterial({ color: 0xffd700, metalness: 0.7, roughness: 0.3, flatShading: true });
            const lock = new THREE.Mesh(new THREE.BoxGeometry(0.2, 0.25, 0.05), lockMat);
            lock.position.set(0, 0.85, 0.58);
            g.add(lock);
            return g;
        }

        // 🗝️ กล่องเหล็ก — สีเทาโลหะ มีลวดลาย
        function createBoxIron(t) {
            const g = new THREE.Group();
            const ironMat = new THREE.MeshStandardMaterial({ color: t.color, roughness: 0.4, metalness: 0.6, flatShading: true });
            const darkMat = new THREE.MeshStandardMaterial({ color: 0x455a64, roughness: 0.5, metalness: 0.5, flatShading: true });
            // กล่องเหล็กหลัก
            const body = new THREE.Mesh(new THREE.BoxGeometry(1.1, 0.85, 1.1), ironMat);
            body.position.y = 0.43; body.castShadow = true; body.receiveShadow = true;
            g.add(body);
            // ฝามน
            const lid = new THREE.Mesh(new THREE.BoxGeometry(1.1, 0.25, 1.1), ironMat);
            lid.position.y = 0.95; lid.castShadow = true;
            g.add(lid); g.userData.lid = lid;
            // ขอบมุมเข้ม
            const edgeMat = darkMat;
            [[-0.55,-0.55],[-0.55,0.55],[0.55,-0.55],[0.55,0.55]].forEach(([x,z]) => {
                const corner = new THREE.Mesh(new THREE.BoxGeometry(0.15, 0.95, 0.15), edgeMat);
                corner.position.set(x, 0.43, z);
                g.add(corner);
            });
            // ลวดลายกลางฝา
            const pattern = new THREE.Mesh(new THREE.CylinderGeometry(0.25, 0.25, 0.05, 8), darkMat);
            pattern.position.y = 1.1;
            g.add(pattern);
            // กุญแจใหญ่
            const lockMat = new THREE.MeshStandardMaterial({ color: 0xffd700, metalness: 0.85, roughness: 0.2, flatShading: true });
            const lock = new THREE.Mesh(new THREE.IcosahedronGeometry(0.18, 0), lockMat);
            lock.position.set(0, 1.15, 0); lock.castShadow = true;
            g.add(lock);
            return g;
        }

        // 💰 กล่องทองคำ — สีทองเปล่งประกาย ประดับอัญมณี
        function createBoxGold(t) {
            const g = new THREE.Group();
            const goldMat = new THREE.MeshStandardMaterial({ 
                color: t.color, metalness: 0.9, roughness: 0.15, flatShading: true,
                emissive: t.glowColor, emissiveIntensity: 0.4
            });
            const jewelMat = new THREE.MeshStandardMaterial({ 
                color: 0xe91e63, emissive: 0xe91e63, emissiveIntensity: 1.0, flatShading: true 
            });
            // กล่องทองหลัก
            const body = new THREE.Mesh(new THREE.BoxGeometry(1.2, 0.9, 1.2), goldMat);
            body.position.y = 0.45; body.castShadow = true; body.receiveShadow = true;
            g.add(body);
            // ฝาทรงสูง
            const lid = new THREE.Mesh(new THREE.BoxGeometry(1.25, 0.3, 1.25), goldMat);
            lid.position.y = 1.0; lid.castShadow = true;
            g.add(lid); g.userData.lid = lid;
            // ยอดประดับ
            const top = new THREE.Mesh(new THREE.IcosahedronGeometry(0.25, 0), goldMat);
            top.position.y = 1.3; top.castShadow = true;
            g.add(top); g.userData.top = top;
            // อัญมณีรอบฝา 4 มุม
            [[-0.45,-0.45],[-0.45,0.45],[0.45,-0.45],[0.45,0.45]].forEach(([x,z]) => {
                const jewel = new THREE.Mesh(new THREE.OctahedronGeometry(0.12, 0), jewelMat);
                jewel.position.set(x, 1.2, z);
                g.add(jewel);
            });
            // อัญมณีกลางฝา (ใหญ่)
            const centerJewel = new THREE.Mesh(new THREE.OctahedronGeometry(0.18, 0), jewelMat);
            centerJewel.position.set(0, 1.2, 0); centerJewel.castShadow = true;
            g.add(centerJewel); g.userData.centerJewel = centerJewel;
            // ลายเส้นทองรอบกล่อง
            const trimMat = new THREE.MeshStandardMaterial({ color: 0xffe082, metalness: 0.95, roughness: 0.1, flatShading: true });
            const trim1 = new THREE.Mesh(new THREE.BoxGeometry(1.25, 0.06, 1.25), trimMat);
            trim1.position.y = 0.2;
            const trim2 = new THREE.Mesh(new THREE.BoxGeometry(1.25, 0.06, 1.25), trimMat);
            trim2.position.y = 0.75;
            g.add(trim1, trim2);
            // PointLight สีทอง
            const light = new THREE.PointLight(0xffa500, 2.0, 6);
            light.position.set(0, 1.2, 0);
            g.add(light);
            return g;
        }

        function createVoxelMushroom(typeKey) {
            const t = MUSHROOM_TYPES[typeKey] || MUSHROOM_TYPES.straw;
            let mesh;
            switch(typeKey) {
                case 'straw':  mesh = createMushroomStraw(t); break;
                case 'magic':  mesh = createMushroomMagic(t); break;
                case 'golden': mesh = createMushroomGolden(t); break;
                default:       mesh = createMushroomStraw(t);
            }
            mesh.userData = { 
                yOffset: t.yOffset, 
                isAnimating: true, 
                kind: 'mushroom', 
                typeKey: typeKey,
                baseColor: t.color,
                glowColor: t.glowColor
            };
            return mesh;
        }

        // 🍄 เห็ดฟางธรรมดา — ด้ามขาว หมวกสีน้ำตาลฟาง กลมเหลี่ยม
        function createMushroomStraw(t) {
            const g = new THREE.Group();
            const stemMat = new THREE.MeshStandardMaterial({ color: 0xf5f5dc, roughness: 0.8, flatShading: true });
            const capMat  = new THREE.MeshStandardMaterial({ color: 0xa1887f, roughness: 0.9, flatShading: true });

            // ด้าม
            const stem = new THREE.Mesh(new THREE.CylinderGeometry(0.18, 0.22, 0.6, 6), stemMat);
            stem.position.y = 0.3; stem.castShadow = true;
            g.add(stem);

            // หมวก (ทรงกลมเหลี่ยมแป้น)
            const cap = new THREE.Mesh(new THREE.IcosahedronGeometry(0.55, 0), capMat);
            cap.scale.set(1.2, 0.6, 1.2); cap.position.y = 0.75; cap.castShadow = true;
            g.add(cap); g.userData.cap = cap;

            // ขอบหมวกเล็ก
            const rim = new THREE.Mesh(new THREE.CylinderGeometry(0.55, 0.55, 0.08, 6), capMat);
            rim.position.y = 0.6;
            g.add(rim);

            return g;
        }

        // ✨ เห็ดเรืองแสงเวทมนตร์ — ด้ามสีฟ้าซีด หมวกเรืองแสงเขียวเงา
        function createMushroomMagic(t) {
            const g = new THREE.Group();
            const stemMat = new THREE.MeshStandardMaterial({ color: 0xb3e5fc, roughness: 0.6, flatShading: true });
            const capMat  = new THREE.MeshStandardMaterial({ 
                color: t.color, roughness: 0.3, flatShading: true, 
                emissive: t.glowColor, emissiveIntensity: 0.9, metalness: 0.2
            });
            const dotMat  = new THREE.MeshStandardMaterial({ color: 0xffffff, emissive: 0xffffff, emissiveIntensity: 1.2, flatShading: true });

            // ด้ามยาวเรียว
            const stem = new THREE.Mesh(new THREE.CylinderGeometry(0.15, 0.2, 0.9, 6), stemMat);
            stem.position.y = 0.45; stem.castShadow = true;
            g.add(stem);

            // หมวกทรงกรวยเหลี่ยม
            const cap = new THREE.Mesh(new THREE.ConeGeometry(0.6, 0.6, 6), capMat);
            cap.position.y = 1.05; cap.castShadow = true;
            g.add(cap); g.userData.cap = cap;

            // จุดเรืองแสงบนหมวก
            for(let i = 0; i < 5; i++) {
                const angle = (i / 5) * Math.PI * 2;
                const dot = new THREE.Mesh(new THREE.IcosahedronGeometry(0.07, 0), dotMat);
                const y = 1.0 - Math.abs(Math.cos(angle)) * 0.15;
                dot.position.set(Math.cos(angle) * 0.3, y, Math.sin(angle) * 0.3);
                g.add(dot);
            }

            // PointLight เรืองแสง
            const light = new THREE.PointLight(t.glowColor, 1.8, 5);
