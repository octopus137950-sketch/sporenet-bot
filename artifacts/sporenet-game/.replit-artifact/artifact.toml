kind = "web"
previewPath = "/"
title = "SporeNet Mushroom Adventure"
description = "A 3D browser adventure game based on the SporeNet Discord mushroom farming system. Players explore a voxel mushroom forest, collect spores, encounter canonical monsters from the bot, and build toward Discord-connected progression."
version = "1.0.0"
id = "artifacts/sporenet-game"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 25133

[services.development]
run = "pnpm --filter @workspace/sporenet-game run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/sporenet-game", "run", "build" ]
serve = "static"
publicDir = "artifacts/sporenet-game/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "25133"
BASE_PATH = "/"
